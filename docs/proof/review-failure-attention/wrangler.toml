# Local proof only. Runtime supplies unique loopback endpoint and synthetic key.
name = "review-failure-attention-local-proof"
main = "worker.ts"
compatibility_date = "2026-05-11"
[[durable_objects.bindings]]
name = "EXACT_REVIEW_QUEUE"
class_name = "ExactReviewQueue"
[[durable_objects.bindings]]
name = "STATUS_STORE"
class_name = "StatusStore"
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ExactReviewQueue", "StatusStore"]
[vars]
CLAWSWEEPER_APP_CLIENT_ID = "synthetic-review-attention-proof"
CLAWSWEEPER_WEBHOOK_SECRET = "synthetic-review-attention-proof"
EXACT_REVIEW_OPERATOR_SECRET = "synthetic-review-attention-proof"
PUBLIC_BAY_REPOS = "openclaw/openclaw,openclaw/clawsweeper"
TARGET_REPOS = "openclaw/openclaw,openclaw/clawsweeper"
EXACT_REVIEW_DISPATCH_DEBOUNCE_MS = "0"
EXACT_REVIEW_DISPATCH_DEBOUNCE_MAX_MS = "0"
# Keep visibility-revocation checks deterministic; no cached public admission.
EXACT_REVIEW_HOSTED_TARGET_ADMISSION_FRESH_MS = "0"
