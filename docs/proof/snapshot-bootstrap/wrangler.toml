name = "snapshot-bootstrap-local-proof"
main = "worker.ts"
compatibility_date = "2026-05-11"

[[durable_objects.bindings]]
name = "EXACT_REVIEW_QUEUE"
class_name = "ExactReviewQueue"

[[durable_objects.bindings]]
name = "STATUS_STORE"
class_name = "StatusStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ExactReviewQueue", "StatusStore"]

[[r2_buckets]]
binding = "STATE_SNAPSHOTS"
bucket_name = "synthetic-snapshot-bootstrap"

[vars]
CLAWSWEEPER_WEBHOOK_SECRET = "synthetic-snapshot-bootstrap-secret"
