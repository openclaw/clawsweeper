name: Setup model CLI
description: Cache, install, and authenticate the configured ClawSweeper model runtime.
inputs:
  model-runtime:
    description: Model runtime to install. Supported values are codex and claude.
    default: "codex"
  codex-version:
    description: Exact Codex CLI npm package version.
    default: "0.139.0"
  proxy-version:
    description: Exact Codex Responses proxy npm package version.
    default: "0.139.0"
  claude-version:
    description: Exact Claude Code npm package version.
    default: "2.1.220"
  claude-provider:
    description: Claude upstream provider. Supported values are anthropic, bedrock, vertex, and foundry.
    default: "anthropic"
  auth-mode:
    description: Authentication mode. Use proxy to keep OPENAI_API_KEY out of Codex subprocesses, or login for legacy codex login.
    default: "proxy"
  codex-home:
    description: CODEX_HOME directory. Defaults to an isolated per-run ClawSweeper directory.
    default: ""
  cache-suffix:
    description: Extra cache key suffix for target-tool downloads.
    default: ""
  login-status:
    description: Run `codex login status` after authentication.
    default: "false"
runs:
  using: composite
  steps:
    - name: Cache Codex CLI and npm downloads
      uses: actions/cache@v6
      with:
        path: |
          ~/.npm
          ~/.cache/node/corepack
          ~/.clawsweeper-repair/codex
          ~/.clawsweeper-repair/claude
        key: ${{ runner.os }}-node24-runtime-${{ inputs['model-runtime'] }}-codex-${{ inputs['codex-version'] }}-proxy-${{ inputs['proxy-version'] }}-claude-${{ inputs['claude-version'] }}-${{ inputs['cache-suffix'] || 'default' }}-v5
        restore-keys: |
          ${{ runner.os }}-node24-runtime-${{ inputs['model-runtime'] }}-
          ${{ runner.os }}-node24-codex-${{ inputs['codex-version'] }}-proxy-${{ inputs['proxy-version'] }}-
          ${{ runner.os }}-node24-codex-

    - name: Install Codex CLI
      if: ${{ inputs['model-runtime'] == 'codex' }}
      shell: bash
      run: |
        set -euo pipefail
        npm config set prefix "$HOME/.clawsweeper-repair/codex"
        npm config set cache "$HOME/.npm"
        echo "$HOME/.clawsweeper-repair/codex/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.clawsweeper-repair/codex/bin:$PATH"

        install_env=(env -u OPENAI_API_KEY -u CODEX_API_KEY -u PROXY_API_KEY -u CLAWSWEEPER_INTERNAL_MODEL)
        "${install_env[@]}" npm install -g "@openai/codex@${{ inputs['codex-version'] }}" \
          --prefer-online --no-audit --no-fund --ignore-scripts
        if [[ "${{ inputs['auth-mode'] }}" == "proxy" ]]; then
          "${install_env[@]}" npm install -g "@openai/codex-responses-api-proxy@${{ inputs['proxy-version'] }}" \
            --prefer-online --no-audit --no-fund --ignore-scripts
        fi
        codex --version

    - name: Install Claude CLI
      if: ${{ inputs['model-runtime'] == 'claude' }}
      shell: bash
      run: |
        set -euo pipefail
        npm config set prefix "$HOME/.clawsweeper-repair/claude"
        npm config set cache "$HOME/.npm"
        echo "$HOME/.clawsweeper-repair/claude/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.clawsweeper-repair/claude/bin:$PATH"

        env -u ANTHROPIC_API_KEY -u ANTHROPIC_AUTH_TOKEN -u CLAUDE_CODE_OAUTH_TOKEN \
          -u CLAWSWEEPER_INTERNAL_MODEL \
          npm install -g "@anthropic-ai/claude-code@${{ inputs['claude-version'] }}" \
          --prefer-online --no-audit --no-fund --ignore-scripts
        claude --version

    - name: Resolve Codex home
      if: ${{ inputs['model-runtime'] == 'codex' }}
      shell: bash
      run: |
        set -euo pipefail
        if [[ -n "${{ inputs['codex-home'] }}" ]]; then
          codex_home="${{ inputs['codex-home'] }}"
        else
          codex_home="$HOME/.clawsweeper-repair/codex-home/${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"
        fi
        mkdir -p "$codex_home"
        chmod 700 "$codex_home"
        echo "CODEX_HOME=$codex_home" >> "$GITHUB_ENV"
        export CODEX_HOME="$codex_home"
        echo "Using isolated CODEX_HOME=$CODEX_HOME"

    - name: Resolve Claude home
      if: ${{ inputs['model-runtime'] == 'claude' }}
      shell: bash
      run: |
        set -euo pipefail
        if [[ -n "${{ inputs['codex-home'] }}" ]]; then
          claude_config_dir="${{ inputs['codex-home'] }}"
        else
          claude_config_dir="$HOME/.clawsweeper-repair/claude-home/${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"
        fi
        mkdir -p "$claude_config_dir"
        chmod 700 "$claude_config_dir"
        echo "CLAUDE_CONFIG_DIR=$claude_config_dir" >> "$GITHUB_ENV"
        echo "CLAWSWEEPER_MODEL_RUNTIME=claude" >> "$GITHUB_ENV"
        echo "CLAWSWEEPER_STEERABLE_CODEX=0" >> "$GITHUB_ENV"
        echo "Using isolated CLAUDE_CONFIG_DIR=$claude_config_dir"

    - name: Configure internal Codex model
      if: ${{ inputs['model-runtime'] == 'codex' }}
      shell: bash
      run: |
        set -euo pipefail
        export CODEX_HOME="${CODEX_HOME:?}"
        test -n "${CLAWSWEEPER_INTERNAL_MODEL:-}"
        model_json="$(node -e 'process.stdout.write(JSON.stringify(process.argv[1]))' "$CLAWSWEEPER_INTERNAL_MODEL")"
        printf 'model = %s\n' "$model_json" > "$CODEX_HOME/config.toml"
        chmod 600 "$CODEX_HOME/config.toml"
        echo "CLAWSWEEPER_MODEL_RUNTIME=codex" >> "$GITHUB_ENV"

    - name: Configure internal Claude model and provider
      if: ${{ inputs['model-runtime'] == 'claude' }}
      shell: bash
      env:
        CLAUDE_PROVIDER: ${{ inputs['claude-provider'] }}
      run: |
        set -euo pipefail
        export CLAUDE_CONFIG_DIR="${CLAUDE_CONFIG_DIR:?}"
        test -n "${CLAWSWEEPER_INTERNAL_MODEL:-}"
        credentials_file="$CLAUDE_CONFIG_DIR/provider-env.json"
        node <<'NODE'
        const fs = require("node:fs");
        const path = require("node:path");
        const provider = process.env.CLAUDE_PROVIDER;
        const supported = new Set(["anthropic", "bedrock", "vertex", "foundry"]);
        if (!supported.has(provider)) {
          throw new Error(`Unsupported Claude provider: ${provider}`);
        }
        const keys = [
          "ANTHROPIC_API_KEY",
          "ANTHROPIC_AUTH_TOKEN",
          "ANTHROPIC_BASE_URL",
          "ANTHROPIC_CUSTOM_HEADERS",
          "ANTHROPIC_FOUNDRY_API_KEY",
          "ANTHROPIC_FOUNDRY_BASE_URL",
          "ANTHROPIC_FOUNDRY_RESOURCE",
          "AWS_ACCESS_KEY_ID",
          "AWS_BEARER_TOKEN_BEDROCK",
          "AWS_DEFAULT_REGION",
          "AWS_PROFILE",
          "AWS_REGION",
          "AWS_SECRET_ACCESS_KEY",
          "AWS_SESSION_TOKEN",
          "CLAUDE_CODE_OAUTH_TOKEN",
          "GOOGLE_APPLICATION_CREDENTIALS",
          "GOOGLE_CLOUD_PROJECT",
          "GOOGLE_CLOUD_REGION",
        ];
        const credentials = Object.fromEntries(
          keys.flatMap((key) => process.env[key] ? [[key, process.env[key]]] : []),
        );
        if (provider === "anthropic" &&
            !credentials.ANTHROPIC_API_KEY &&
            !credentials.ANTHROPIC_AUTH_TOKEN &&
            !credentials.CLAUDE_CODE_OAUTH_TOKEN) {
          throw new Error("Claude Anthropic provider requires ANTHROPIC_API_KEY, ANTHROPIC_AUTH_TOKEN, or CLAUDE_CODE_OAUTH_TOKEN.");
        }
        if (provider === "bedrock") credentials.CLAUDE_CODE_USE_BEDROCK = "1";
        if (provider === "vertex") credentials.CLAUDE_CODE_USE_VERTEX = "1";
        if (provider === "foundry") credentials.CLAUDE_CODE_USE_FOUNDRY = "1";
        const configDir = process.env.CLAUDE_CONFIG_DIR;
        fs.writeFileSync(
          path.join(configDir, "settings.json"),
          `${JSON.stringify({
            model: process.env.CLAWSWEEPER_INTERNAL_MODEL,
            skipDangerousModePermissionPrompt: true,
          }, null, 2)}\n`,
          { mode: 0o600 },
        );
        fs.writeFileSync(
          path.join(configDir, "provider-env.json"),
          `${JSON.stringify(credentials)}\n`,
          { mode: 0o600 },
        );
        NODE
        echo "CLAWSWEEPER_CLAUDE_CREDENTIALS_FILE=$credentials_file" >> "$GITHUB_ENV"

    - name: Authenticate Codex through Responses proxy
      if: ${{ inputs['model-runtime'] == 'codex' && inputs['auth-mode'] == 'proxy' }}
      shell: bash
      run: |
        set -euo pipefail
        export CODEX_HOME="${CODEX_HOME:?}"
        test -n "${OPENAI_API_KEY:-}"
        server_info="$CODEX_HOME/responses-proxy.json"
        node -e 'require("node:fs").rmSync(process.argv[1], { force: true })' "$server_info"
        (
          printenv OPENAI_API_KEY | env -u OPENAI_API_KEY -u CODEX_API_KEY -u PROXY_API_KEY \
            codex-responses-api-proxy --http-shutdown --server-info "$server_info"
        ) &
        for _ in {1..100}; do
          [[ -s "$server_info" ]] && break
          sleep 0.1
        done
        if [[ ! -s "$server_info" ]]; then
          echo "codex-responses-api-proxy did not write server info" >&2
          exit 1
        fi
        port="$(node -e 'const fs=require("fs"); const p=process.argv[1]; const data=JSON.parse(fs.readFileSync(p,"utf8")); if (!Number.isInteger(data.port)) process.exit(2); process.stdout.write(String(data.port));' "$server_info")"
        model_json="$(node -e 'process.stdout.write(JSON.stringify(process.argv[1]))' "$CLAWSWEEPER_INTERNAL_MODEL")"
        cat > "$CODEX_HOME/config.toml" <<EOF
        model = ${model_json}
        model_provider = "clawsweeper-responses-proxy"

        [model_providers.clawsweeper-responses-proxy]
        name = "ClawSweeper Responses Proxy"
        base_url = "http://127.0.0.1:${port}/v1"
        wire_api = "responses"
        EOF
        chmod 600 "$CODEX_HOME/config.toml"
        echo "Configured Codex Responses proxy on localhost."

    - name: Authenticate Codex with login
      if: ${{ inputs['model-runtime'] == 'codex' && inputs['auth-mode'] == 'login' }}
      shell: bash
      run: |
        set -euo pipefail
        export CODEX_HOME="${CODEX_HOME:?}"
        test -n "${OPENAI_API_KEY:-}"
        printenv OPENAI_API_KEY | codex login --with-api-key >/dev/null
        if [[ "${{ inputs['login-status'] }}" == "true" ]]; then
          codex login status
        fi

    - name: Reject unknown Codex auth mode
      if: ${{ inputs['model-runtime'] == 'codex' && inputs['auth-mode'] != 'proxy' && inputs['auth-mode'] != 'login' }}
      shell: bash
      run: |
        echo "Unsupported setup-codex auth-mode: ${{ inputs['auth-mode'] }}" >&2
        exit 1

    - name: Reject unknown model runtime
      if: ${{ inputs['model-runtime'] != 'codex' && inputs['model-runtime'] != 'claude' }}
      shell: bash
      run: |
        echo "Unsupported model runtime: ${{ inputs['model-runtime'] }}" >&2
        exit 1
