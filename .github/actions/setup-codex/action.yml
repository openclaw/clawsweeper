name: Setup Codex CLI
description: Cache, install, and authenticate the OpenAI Codex CLI.
inputs:
  version:
    description: Codex CLI npm package version.
    default: "0.130.0"
  auth-mode:
    description: Authentication mode. `proxy` runs codex-responses-api-proxy from OPENAI_API_KEY. `login` runs `codex login --with-api-key`. `subscription` uses the runner's existing `~/.codex/auth.json` (ChatGPT subscription JWT) — no API key required.
    default: "proxy"
  codex-home:
    description: CODEX_HOME directory. Defaults to an isolated per-run ClawSweeper directory.
    default: ""
  cache-suffix:
    description: Extra cache key suffix for target-tool downloads.
    default: ""
  login-status:
    description: Run `codex login status` after authentication.
    default: "false"
runs:
  using: composite
  steps:
    # On GitHub-hosted runners, restore/save Codex + npm caches via the GHA
    # cache service (~50s/job). On self-hosted runners ~/.clawsweeper-repair/codex
    # (Codex CLI install) and ~/.npm already persist across runs, so the cache
    # step is pure wasted I/O. The install step below is idempotent — it
    # reinstalls only when codex is missing or the version differs.
    # Verified 2026-05-21: actions/cache@v5 added ~50s to setup-codex on
    # mac-mini runners with 2.3 GB ~/.clawsweeper-repair already on disk.
    - name: Cache Codex CLI and npm downloads
      if: runner.environment != 'self-hosted'
      uses: actions/cache@v5
      with:
        path: |
          ~/.npm
          ~/.cache/node/corepack
          ~/.clawsweeper-repair/codex
        key: ${{ runner.os }}-node24-codex-${{ inputs.version }}-${{ inputs['cache-suffix'] || 'default' }}-v2
        restore-keys: |
          ${{ runner.os }}-node24-codex-${{ inputs.version }}-
          ${{ runner.os }}-node24-codex-

    - name: Install Codex CLI
      shell: bash
      run: |
        set -euo pipefail
        npm config set prefix "$HOME/.clawsweeper-repair/codex"
        npm config set cache "$HOME/.npm"
        echo "$HOME/.clawsweeper-repair/codex/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.clawsweeper-repair/codex/bin:$PATH"

        if ! command -v codex >/dev/null 2>&1 || ! codex --version | grep -Fq "${{ inputs.version }}"; then
          npm install -g "@openai/codex@${{ inputs.version }}" --prefer-offline --no-audit --no-fund
        fi
        if [[ "${{ inputs['auth-mode'] }}" == "proxy" ]] && ! npm list -g --depth=0 "@openai/codex-responses-api-proxy@${{ inputs.version }}" >/dev/null 2>&1; then
          npm install -g "@openai/codex-responses-api-proxy@${{ inputs.version }}" --prefer-offline --no-audit --no-fund
        fi
        # subscription mode needs no extra install — uses runner's existing auth.json
        codex --version

    - name: Resolve Codex home
      shell: bash
      run: |
        set -euo pipefail
        if [[ -n "${{ inputs['codex-home'] }}" ]]; then
          codex_home="${{ inputs['codex-home'] }}"
        else
          codex_home="$HOME/.clawsweeper-repair/codex-home/${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"
        fi
        mkdir -p "$codex_home"
        chmod 700 "$codex_home"
        echo "CODEX_HOME=$codex_home" >> "$GITHUB_ENV"
        export CODEX_HOME="$codex_home"
        echo "Using isolated CODEX_HOME=$CODEX_HOME"

    - name: Authenticate Codex through Responses proxy
      if: ${{ inputs['auth-mode'] == 'proxy' }}
      shell: bash
      run: |
        set -euo pipefail
        export CODEX_HOME="${CODEX_HOME:?}"
        test -n "${OPENAI_API_KEY:-}"
        server_info="$CODEX_HOME/responses-proxy.json"
        if [[ ! -s "$server_info" ]]; then
          (
            printenv OPENAI_API_KEY | env -u OPENAI_API_KEY -u CODEX_API_KEY -u PROXY_API_KEY \
              codex-responses-api-proxy --http-shutdown --server-info "$server_info"
          ) &
        fi
        for _ in {1..100}; do
          [[ -s "$server_info" ]] && break
          sleep 0.1
        done
        if [[ ! -s "$server_info" ]]; then
          echo "codex-responses-api-proxy did not write server info" >&2
          exit 1
        fi
        port="$(node -e 'const fs=require("fs"); const p=process.argv[1]; const data=JSON.parse(fs.readFileSync(p,"utf8")); if (!Number.isInteger(data.port)) process.exit(2); process.stdout.write(String(data.port));' "$server_info")"
        cat > "$CODEX_HOME/config.toml" <<EOF
        model_provider = "clawsweeper-responses-proxy"

        [model_providers.clawsweeper-responses-proxy]
        name = "ClawSweeper Responses Proxy"
        base_url = "http://127.0.0.1:${port}/v1"
        wire_api = "responses"
        EOF
        chmod 600 "$CODEX_HOME/config.toml"
        echo "Configured Codex Responses proxy on localhost."

    - name: Authenticate Codex with login
      if: ${{ inputs['auth-mode'] == 'login' }}
      shell: bash
      run: |
        set -euo pipefail
        export CODEX_HOME="${CODEX_HOME:?}"
        test -n "${OPENAI_API_KEY:-}"
        printenv OPENAI_API_KEY | codex login --with-api-key >/dev/null
        if [[ "${{ inputs['login-status'] }}" == "true" ]]; then
          codex login status
        fi

    - name: Authenticate Codex with ChatGPT subscription
      if: ${{ inputs['auth-mode'] == 'subscription' }}
      shell: bash
      run: |
        set -euo pipefail
        export CODEX_HOME="${CODEX_HOME:?}"
        # Bridge the per-run isolated CODEX_HOME to the runner's persistent ChatGPT auth.
        # `~/.codex/auth.json` must already exist on the runner with mode=chatgpt (4–5 kB JWT).
        # See: project_codex_billing_paths memory note.
        if [[ ! -f "$HOME/.codex/auth.json" ]]; then
          echo "::error::No ~/.codex/auth.json on this runner. Run \`codex login\` once and pick \"Sign in with ChatGPT\"." >&2
          exit 1
        fi
        size=$(stat -f%z "$HOME/.codex/auth.json" 2>/dev/null || stat -c%s "$HOME/.codex/auth.json")
        if [[ "$size" -lt 500 ]]; then
          echo "::error::~/.codex/auth.json is $size bytes — looks like an API-key entry (expected ChatGPT JWT, ~4–5 kB). Re-login with \`codex logout && codex login\` and pick \"Sign in with ChatGPT\"." >&2
          exit 1
        fi
        ln -sf "$HOME/.codex/auth.json" "$CODEX_HOME/auth.json"
        # Mode assertion fails loudly if somehow we're still on apikey.
        status=$(codex login status 2>&1 || true)
        echo "$status"
        echo "$status" | grep -Fq "Logged in using ChatGPT" || { echo "::error::codex not in ChatGPT mode: $status" >&2; exit 1; }
        if [[ "${{ inputs['login-status'] }}" == "true" ]]; then
          codex login status
        fi

    - name: Reject unknown Codex auth mode
      if: ${{ inputs['auth-mode'] != 'proxy' && inputs['auth-mode'] != 'login' && inputs['auth-mode'] != 'subscription' }}
      shell: bash
      run: |
        echo "Unsupported setup-codex auth-mode: ${{ inputs['auth-mode'] }}" >&2
        exit 1
