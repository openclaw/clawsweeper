name: Setup Codex CLI
description: Cache, install, and authenticate the OpenAI Codex CLI.
inputs:
  codex-version:
    description: Exact Codex CLI npm package version.
    default: "0.153.3"
  proxy-version:
    description: Exact Codex Responses proxy npm package version.
    default: "0.139.0"
  auth-mode:
    description: Authentication mode. Use clawrouter for private alias inference, proxy for an isolated API-key proxy, or login for legacy codex login.
    default: "proxy"
  codex-home:
    description: CODEX_HOME directory. Defaults to an isolated per-run ClawSweeper directory.
    default: ""
  review-network:
    description: Enable the credential-free, allowlisted read-only reviewer profile.
    default: "false"
  cache-suffix:
    description: Extra cache key suffix for target-tool downloads.
    default: ""
  login-status:
    description: Run `codex login status` after authentication.
    default: "false"
runs:
  using: composite
  steps:
    - name: Install trusted review scanner
      shell: bash
      run: bash "${{ github.action_path }}/../setup-review-tools/install.sh"

    - name: Cache Codex CLI and npm downloads
      uses: actions/cache@v6
      with:
        path: |
          ~/.npm
          ~/.cache/node/corepack
          ~/.clawsweeper-repair/codex
        key: ${{ runner.os }}-node24-codex-${{ inputs['codex-version'] }}-proxy-${{ inputs['proxy-version'] }}-${{ inputs['cache-suffix'] || 'default' }}-v4
        restore-keys: |
          ${{ runner.os }}-node24-codex-${{ inputs['codex-version'] }}-proxy-${{ inputs['proxy-version'] }}-
          ${{ runner.os }}-node24-codex-

    - name: Install Codex CLI
      shell: bash
      run: |
        set -euo pipefail
        echo "$HOME/.clawsweeper-repair/codex/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.clawsweeper-repair/codex/bin:$PATH"

        install_env=(env -u OPENAI_API_KEY -u CODEX_API_KEY -u PROXY_API_KEY -u CLAWSWEEPER_INTERNAL_MODEL -u CLAWSWEEPER_CLAWROUTER_CONFIG)
        npm_configured=false
        ensure_installed() {
          local name="$1" version="$2" status
          if "${install_env[@]}" node "$GITHUB_ACTION_PATH/validate-install.mjs" "$name" "$version"; then
            return
          else
            status=$?
          fi
          # Only an absent or unusable contained installation may be repaired.
          if [[ "$status" != 1 ]]; then return "$status"; fi
          if [[ "$npm_configured" == false ]]; then
            "${install_env[@]}" npm config set prefix "$HOME/.clawsweeper-repair/codex"
            "${install_env[@]}" npm config set cache "$HOME/.npm"
            npm_configured=true
          fi
          "${install_env[@]}" npm install -g "@openai/$name@$version" \
            --prefer-online --no-audit --no-fund --ignore-scripts
          "${install_env[@]}" node "$GITHUB_ACTION_PATH/validate-install.mjs" "$name" "$version"
        }
        ensure_installed codex "${{ inputs['codex-version'] }}"
        if [[ "${{ inputs['auth-mode'] }}" == "proxy" ]]; then
          ensure_installed codex-responses-api-proxy "${{ inputs['proxy-version'] }}"
        fi

    - name: Enable Linux user namespaces for bubblewrap
      if: ${{ runner.os == 'Linux' && runner.environment == 'github-hosted' }}
      shell: bash
      run: |
        set -euo pipefail

        # Codex read-only reviews use bubblewrap. Newer Ubuntu images otherwise
        # reject its loopback setup before the first repository command runs.
        current_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
        if [[ -n "$current_userns" && "$current_userns" != "1" ]]; then
          sudo sysctl -w kernel.unprivileged_userns_clone=1
        fi

        current_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
        if [[ -n "$current_apparmor" && "$current_apparmor" != "0" ]]; then
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
        fi

        # Keep the baseline backend probe for non-review Codex consumers.
        # A sandbox regression must stop the job before it can publish a verdict.
        codex sandbox --permission-profile :read-only -C "$GITHUB_WORKSPACE" -- /bin/true

    - name: Resolve Codex home
      shell: bash
      run: |
        set -euo pipefail
        if [[ -n "${{ inputs['codex-home'] }}" ]]; then
          codex_home="${{ inputs['codex-home'] }}"
        else
          codex_home="$HOME/.clawsweeper-repair/codex-home/${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}"
        fi
        mkdir -p "$codex_home"
        chmod 700 "$codex_home"
        echo "CODEX_HOME=$codex_home" >> "$GITHUB_ENV"
        export CODEX_HOME="$codex_home"
        echo "Using isolated CODEX_HOME=$CODEX_HOME"

    - name: Configure internal Codex model
      if: ${{ inputs['auth-mode'] != 'clawrouter' }}
      shell: bash
      run: |
        set -euo pipefail
        export CODEX_HOME="${CODEX_HOME:?}"
        test -n "${CLAWSWEEPER_INTERNAL_MODEL:-}"
        model_json="$(node -e 'process.stdout.write(JSON.stringify(process.argv[1]))' "$CLAWSWEEPER_INTERNAL_MODEL")"
        printf 'model = %s\n' "$model_json" > "$CODEX_HOME/config.toml"
        chmod 600 "$CODEX_HOME/config.toml"

    - name: Configure private ClawRouter inference
      if: ${{ inputs['auth-mode'] == 'clawrouter' }}
      shell: bash
      run: node "${{ github.action_path }}/configure-clawrouter.mjs"

    - name: Authenticate Codex through Responses proxy
      if: ${{ inputs['auth-mode'] == 'proxy' }}
      shell: bash
      run: |
        set -euo pipefail
        export CODEX_HOME="${CODEX_HOME:?}"
        test -n "${OPENAI_API_KEY:-}"
        server_info="$CODEX_HOME/responses-proxy.json"
        node -e 'require("node:fs").rmSync(process.argv[1], { force: true })' "$server_info"
        (
          printenv OPENAI_API_KEY | env -u OPENAI_API_KEY -u CODEX_API_KEY -u PROXY_API_KEY \
            codex-responses-api-proxy --http-shutdown --server-info "$server_info"
        ) &
        for _ in {1..100}; do
          [[ -s "$server_info" ]] && break
          sleep 0.1
        done
        if [[ ! -s "$server_info" ]]; then
          echo "codex-responses-api-proxy did not write server info" >&2
          exit 1
        fi
        port="$(node -e 'const fs=require("fs"); const p=process.argv[1]; const data=JSON.parse(fs.readFileSync(p,"utf8")); if (!Number.isInteger(data.port)) process.exit(2); process.stdout.write(String(data.port));' "$server_info")"
        model_json="$(node -e 'process.stdout.write(JSON.stringify(process.argv[1]))' "$CLAWSWEEPER_INTERNAL_MODEL")"
        cat > "$CODEX_HOME/config.toml" <<EOF
        model = ${model_json}
        model_provider = "clawsweeper-responses-proxy"

        [model_providers.clawsweeper-responses-proxy]
        name = "ClawSweeper Responses Proxy"
        base_url = "http://127.0.0.1:${port}/v1"
        wire_api = "responses"
        EOF
        chmod 600 "$CODEX_HOME/config.toml"
        echo "Configured Codex Responses proxy on localhost."

    - name: Authenticate Codex with login
      if: ${{ inputs['auth-mode'] == 'login' }}
      shell: bash
      run: |
        set -euo pipefail
        export CODEX_HOME="${CODEX_HOME:?}"
        test -n "${OPENAI_API_KEY:-}"
        printenv OPENAI_API_KEY | codex login --with-api-key >/dev/null
        if [[ "${{ inputs['login-status'] }}" == "true" ]]; then
          codex login status
        fi

    - name: Configure direct API context
      if: ${{ inputs['auth-mode'] == 'proxy' || inputs['auth-mode'] == 'login' }}
      shell: bash
      run: node "${{ github.action_path }}/configure-api-context.mjs" "${{ inputs['codex-version'] }}"

    - name: Reject unknown Codex auth mode
      if: ${{ inputs['auth-mode'] != 'proxy' && inputs['auth-mode'] != 'login' && inputs['auth-mode'] != 'clawrouter' }}
      shell: bash
      run: |
        echo "Unsupported setup-codex auth-mode: ${{ inputs['auth-mode'] }}" >&2
        exit 1

    - name: Configure review network profile
      if: ${{ inputs['review-network'] == 'true' }}
      shell: bash
      run: node "${{ github.action_path }}/configure-review-network.mjs"

    - name: Verify review sandbox capabilities
      if: ${{ inputs['review-network'] == 'true' }}
      shell: bash
      run: bash "${{ github.action_path }}/smoke-review-network.sh"
