name: Setup ClawSweeper state
description: Checkout generated state and hydrate it into the ClawSweeper worktree.
inputs:
  token:
    description: GitHub token with contents read/write access to the state repo.
    required: true
  state-path:
    description: Checkout path for the generated state repository.
    required: false
    default: clawsweeper-state
  worktree-path:
    description: ClawSweeper checkout path to hydrate.
    required: false
    default: .
  node-version:
    description: Node.js version used to run the TypeScript hydrator.
    required: false
    default: "24"
  filter:
    description: Git partial clone filter for the generated state repository.
    required: false
    default: ""
  fetch-depth:
    description: Git fetch depth for the generated state repository. Publish retries fetch the remote tip before rebasing.
    required: false
    default: "1"
  sparse-checkout:
    description: Optional newline-separated state paths to hydrate.
    required: false
    default: ""
  persist-credentials:
    description: Persist the checkout token in local git config for later state publication.
    required: false
    default: "true"
  coordinator-url:
    description: Durable FIFO coordinator used before any generated-state mutation.
    required: false
    default: https://clawsweeper.openclaw.ai
  coordinator-enabled:
    description: Enable durable FIFO admission; false is the explicit legacy-fence rollback mode.
    required: false
    default: "false"
  coordinator-class:
    description: Durable state-writer scheduling class
    required: false
    default: ordinary
  records-source:
    description: Record transport used by hydrate-state (git or worker).
    required: false
    default: git
  records-url:
    description: Worker base URL used when records-source is worker.
    required: false
    default: https://clawsweeper.openclaw.ai
  records-repo-slugs:
    description: Optional comma/newline-separated record repository slugs; defaults to the Worker record store's slug list.
    required: false
    default: ""
  records-secret:
    description: HMAC secret used only when records-source is worker.
    required: false
    default: ""
  ledger-source:
    description: Ledger/assets blob transport used by hydrate-state (git or worker). Worker mode reuses records-url and records-secret.
    required: false
    default: git
runs:
  using: composite
  steps:
    # Worker transport owns the three enormous generated trees. Do not make every
    # hydrator materialize the 42 GB git projection before replacing those trees
    # from the Worker. An explicit sparse checkout still wins, and either git
    # source keeps the full checkout as the deliberate rollback path.
    - name: Check out Worker-projected state
      if: ${{ inputs.sparse-checkout == '' && inputs.records-source == 'worker' && inputs.ledger-source == 'worker' }}
      uses: actions/checkout@v7
      with:
        repository: openclaw/clawsweeper-state
        ref: state
        path: ${{ inputs.state-path }}
        token: ${{ inputs.token }}
        filter: ${{ inputs.filter || 'blob:none' }}
        fetch-depth: ${{ inputs.fetch-depth }}
        sparse-checkout: |
          /jobs/
          /results/
          /notifications/
          /apply-report.json
          /repair-apply-report.json
        sparse-checkout-cone-mode: false
        persist-credentials: ${{ inputs.persist-credentials }}

    - name: Check out git-projected state
      if: ${{ inputs.sparse-checkout != '' || inputs.records-source != 'worker' || inputs.ledger-source != 'worker' }}
      uses: actions/checkout@v7
      with:
        repository: openclaw/clawsweeper-state
        ref: state
        path: ${{ inputs.state-path }}
        token: ${{ inputs.token }}
        filter: ${{ inputs.filter }}
        fetch-depth: ${{ inputs.fetch-depth }}
        sparse-checkout: ${{ inputs.sparse-checkout }}
        persist-credentials: ${{ inputs.persist-credentials }}

    - name: Export state root
      shell: bash
      env:
        STATE_COORDINATOR_ENABLED: ${{ inputs.coordinator-enabled }}
        STATE_COORDINATOR_URL: ${{ inputs.coordinator-url }}
      # Keep immutable ledger server merges dormant until state publishers can
      # fetch a merge-heavy shallow branch without hydrating its ancestry.
      # The repository variable is the migration/rollback boundary. Once it is
      # enabled, the publisher itself fails closed if its step-scoped credential
      # or this URL is missing; checkout-only jobs never receive that credential.
      run: |
        case "$STATE_COORDINATOR_ENABLED" in
          true) coordinator_enabled=1 ;;
          false) coordinator_enabled=0 ;;
          *) echo "coordinator-enabled must be true or false" >&2; exit 2 ;;
        esac
        {
          echo "CLAWSWEEPER_STATE_DIR=$GITHUB_WORKSPACE/${{ inputs.state-path }}"
          echo "CLAWSWEEPER_STATE_COORDINATOR_ENABLED=$coordinator_enabled"
          echo "CLAWSWEEPER_STATE_COORDINATOR_URL=$STATE_COORDINATOR_URL"
          echo "CLAWSWEEPER_STATE_COORDINATOR_CLASS=${{ inputs.coordinator-class }}"
        } >> "$GITHUB_ENV"

    - uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Resolve Worker record snapshot cache key
      id: records-snapshot
      if: ${{ inputs.records-source == 'worker' }}
      shell: bash
      env:
        CLAWSWEEPER_STATE_DIR: ${{ inputs.state-path }}
        CLAWSWEEPER_RECORDS_URL: ${{ inputs.records-url }}
        CLAWSWEEPER_RECORDS_REPO_SLUGS: ${{ inputs.records-repo-slugs }}
        CLAWSWEEPER_RECORDS_SECRET: ${{ inputs.records-secret }}
      run: node "${{ inputs.worktree-path }}/scripts/prepare-worker-record-cache.ts"

    - name: Restore Worker record snapshot
      if: ${{ inputs.records-source == 'worker' && steps.records-snapshot.outputs.available == 'true' }}
      uses: actions/cache@v6
      with:
        path: ${{ inputs.worktree-path }}/.artifacts/worker-records-cache
        key: clawsweeper-records-${{ runner.os }}-${{ steps.records-snapshot.outputs.cache-key }}

    - name: Restore Worker blob cache
      if: ${{ inputs.ledger-source == 'worker' }}
      uses: actions/cache@v6
      with:
        path: ${{ inputs.worktree-path }}/.artifacts/worker-blobs-cache
        # Blob cache entries are digest-addressed and immutable, so any prior
        # cache is a valid warm start; the run-unique key makes every run save
        # its grown cache for the next one to restore by prefix.
        key: clawsweeper-blobs-${{ runner.os }}-${{ github.run_id }}
        restore-keys: |
          clawsweeper-blobs-${{ runner.os }}-

    - name: Hydrate generated state
      shell: bash
      env:
        CLAWSWEEPER_STATE_DIR: ${{ inputs.state-path }}
        CLAWSWEEPER_RECORDS_SOURCE: ${{ inputs.records-source }}
        CLAWSWEEPER_RECORDS_URL: ${{ inputs.records-url }}
        CLAWSWEEPER_RECORDS_REPO_SLUGS: ${{ inputs.records-repo-slugs }}
        CLAWSWEEPER_RECORDS_SECRET: ${{ inputs.records-secret }}
        CLAWSWEEPER_RECORDS_CACHE_DIR: ${{ inputs.worktree-path }}/.artifacts/worker-records-cache
        CLAWSWEEPER_LEDGER_SOURCE: ${{ inputs.ledger-source }}
        CLAWSWEEPER_BLOBS_CACHE_DIR: ${{ inputs.worktree-path }}/.artifacts/worker-blobs-cache
      run: node "${{ inputs.worktree-path }}/scripts/hydrate-state.ts" --state-dir "${{ inputs.state-path }}" --worktree "${{ inputs.worktree-path }}"
