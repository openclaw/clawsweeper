name: Setup pnpm workspace
description: Setup Node, install pnpm dependencies, and optionally run a build script.
inputs:
  node-version:
    description: Node.js version.
    default: "24"
  pnpm-version:
    description: pnpm version to activate through Corepack.
    default: "10.33.2"
  working-directory:
    description: Directory containing package.json.
    default: "."
  build-script:
    description: Optional pnpm script to run after install.
    default: ""
runs:
  using: composite
  steps:
    - name: Ensure gh CLI is on PATH
      shell: bash
      run: |
        set -euo pipefail
        if command -v gh >/dev/null 2>&1; then
          echo "gh already on PATH: $(command -v gh)"
          exit 0
        fi
        for candidate in /opt/homebrew/bin /usr/local/bin /home/linuxbrew/.linuxbrew/bin; do
          if [ -x "$candidate/gh" ]; then
            echo "$candidate" >> "$GITHUB_PATH"
            echo "resolved gh at $candidate/gh"
            exit 0
          fi
        done
        echo "gh CLI not found on runner; install it (brew install gh / apt-get install gh) or ensure it is on PATH for the actions-runner service." >&2
        exit 1

    - uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}

    - name: Enable pinned pnpm
      shell: bash
      run: |
        set -euo pipefail
        corepack enable
        for attempt in 1 2 3; do
          if corepack prepare "pnpm@${{ inputs.pnpm-version }}" --activate; then
            exit 0
          fi
          sleep "$((attempt * 10))"
        done
        corepack prepare "pnpm@${{ inputs.pnpm-version }}" --activate

    - name: Resolve pnpm store
      id: pnpm-store
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

    - name: Resolve pnpm cache key
      id: pnpm-cache-key
      shell: bash
      run: |
        set -euo pipefail
        lockfile="${{ inputs.working-directory }}/pnpm-lock.yaml"
        if [ -f "$lockfile" ]; then
          lock_hash="$(git hash-object "$lockfile")"
        else
          lock_hash="no-lockfile"
        fi
        {
          echo "key=${RUNNER_OS:-unknown}-pnpm-${{ inputs.pnpm-version }}-$lock_hash"
          echo "restore_key=${RUNNER_OS:-unknown}-pnpm-${{ inputs.pnpm-version }}-"
          echo "fallback_restore_key=${RUNNER_OS:-unknown}-pnpm-"
        } >> "$GITHUB_OUTPUT"

    # On GitHub-hosted runners, restore/save the pnpm store from the GHA
    # cache service (~50s/job, ~550 MB). On self-hosted runners, the pnpm
    # store at ~/Library/pnpm/store (macOS) / ~/.local/share/pnpm/store (Linux)
    # already persists across runs, so the cache step is pure wasted I/O.
    # Verified 2026-05-21: actions/cache@v5 download took 51s on mac-mini
    # runners while a 1.9 GB local store was already present.
    - uses: actions/cache@v5
      if: runner.environment != 'self-hosted'
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ steps.pnpm-cache-key.outputs.key }}
        restore-keys: |
          ${{ steps.pnpm-cache-key.outputs.restore_key }}
          ${{ steps.pnpm-cache-key.outputs.fallback_restore_key }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          if pnpm install --frozen-lockfile; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            exit 1
          fi
          sleep "$((attempt * 10))"
        done
        if [[ -n "${{ inputs.build-script }}" ]]; then
          pnpm run "${{ inputs.build-script }}"
        fi
