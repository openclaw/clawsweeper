name: Setup pnpm workspace
description: Setup Node, install pnpm dependencies, and optionally run a build script.
inputs:
  node-version:
    description: Node.js version.
    default: "24.22.1"
  pnpm-version:
    description: pnpm version to activate through Corepack.
    default: "12.15.0"
  working-directory:
    description: Directory containing package.json.
    default: "."
  build-script:
    description: Optional pnpm script to run after install.
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Enable pinned pnpm
      shell: bash
      run: |
        set -euo pipefail
        corepack enable
        for attempt in 1 2 3; do
          if corepack prepare "pnpm@${INPUTS_PNPM_VERSION}" --activate; then
            exit 0
          fi
          sleep "$((attempt * 10))"
        done
        corepack prepare "pnpm@${INPUTS_PNPM_VERSION}" --activate
      env:
        INPUTS_PNPM_VERSION: ${{ inputs.pnpm-version }}

    - name: Resolve pnpm store
      id: pnpm-store
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        store_path="$(pnpm store path --silent)"
        printf 'path=%s\n' "$store_path" >> "$GITHUB_OUTPUT"

    - name: Resolve pnpm cache key
      id: pnpm-cache-key
      shell: bash
      run: |
        set -euo pipefail
        if [[ ! "$INPUTS_PNPM_VERSION" =~ ^[A-Za-z0-9.+_/@:-]+$ ]]; then
          echo "::error::Invalid pnpm version." >&2
          exit 1
        fi
        lockfile="${INPUTS_WORKING_DIRECTORY}/pnpm-lock.yaml"
        if [ -f "$lockfile" ]; then
          lock_hash="$(git hash-object "$lockfile")"
        else
          lock_hash="no-lockfile"
        fi
        workspace="${INPUTS_WORKING_DIRECTORY}/pnpm-workspace.yaml"
        if [ -f "$workspace" ]; then
          policy_hash="$(git hash-object "$workspace")"
        else
          policy_hash="no-workspace"
        fi
        {
          echo "key=${RUNNER_OS:-unknown}-pnpm-${INPUTS_PNPM_VERSION}-$policy_hash-$lock_hash"
          echo "restore_key=${RUNNER_OS:-unknown}-pnpm-${INPUTS_PNPM_VERSION}-$policy_hash-"
        } >> "$GITHUB_OUTPUT"
      env:
        INPUTS_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUTS_PNPM_VERSION: ${{ inputs.pnpm-version }}

    - uses: actions/cache@v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ steps.pnpm-cache-key.outputs.key }}
        restore-keys: |
          ${{ steps.pnpm-cache-key.outputs.restore_key }}

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          if pnpm install --frozen-lockfile; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            exit 1
          fi
          sleep "$((attempt * 10))"
        done
        if [[ -n "${INPUTS_BUILD_SCRIPT}" ]]; then
          pnpm run "${INPUTS_BUILD_SCRIPT}"
        fi
      env:
        INPUTS_BUILD_SCRIPT: ${{ inputs.build-script }}
