name: Snapshot canonical Worker records

on:
  schedule:
    - cron: "9 */6 * * *"
  workflow_dispatch:
    inputs:
      target_repo:
        description: Repository whose canonical records should be snapshotted (owner/name).
        required: true
        type: string

concurrency:
  group: worker-records-snapshot
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLAWSWEEPER_RECORDS_URL: ${{ vars.CLAWSWEEPER_EXACT_REVIEW_QUEUE_URL || 'https://clawsweeper.openclaw.ai' }}

jobs:
  snapshot:
    name: Build and upload canonical records snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm

      - name: Resolve target record slug
        id: target
        env:
          TARGET_REPO: ${{ github.event_name == 'schedule' && 'openclaw/openclaw' || inputs.target_repo }}
        run: |
          if ! [[ "$TARGET_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
            echo "target_repo must be owner/name" >&2
            exit 2
          fi
          echo "slug=${TARGET_REPO//\//-}" >> "$GITHUB_OUTPUT"

      - name: Build and upload canonical records snapshot
        env:
          CLAWSWEEPER_WEBHOOK_SECRET: ${{ secrets.CLAWSWEEPER_WEBHOOK_SECRET }}
          TARGET_SLUG: ${{ steps.target.outputs.slug }}
        run: |
          node scripts/worker-records.ts snapshot-upload --repo-slug "$TARGET_SLUG" > snapshot-result.json
          cat snapshot-result.json
          {
            echo '### Canonical records snapshot'
            echo
            echo '```json'
            cat snapshot-result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
