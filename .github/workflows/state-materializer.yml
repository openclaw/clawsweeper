name: Materialize queued state

on:
  schedule:
    # A cycle now drains up to 10k rows and can run for tens of minutes; a
    # 5-minute schedule queued runs faster than they could execute (observed
    # 2h14m wait for a slot). Fire at the cadence a cycle can actually finish.
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      intake_priority:
        description: "Prioritize a newly accepted durable cluster intake"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  CLAWSWEEPER_APP_CLIENT_ID: Iv23liOECG0slfuhz093

jobs:
  # Workflow-level concurrency left superseded runs in status "pending" with no
  # job created, where neither GitHub's pending-run dedup nor an in-run step
  # could touch them (observed twice on 2026-07-26: 6-9 pending runs each
  # serializing up to an hour of lock time for a drain the newest run performs
  # anyway). Scoping the group to the drain job lets every trigger start this
  # dedupe job immediately while the drain job alone waits on the group.
  dedupe:
    name: Cancel superseded scheduled runs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel older runs still waiting for the drain slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Every cycle drains the whole append window, so any older run that
          # has not started draining is redundant with this one. Only schedule
          # runs are candidates: workflow_dispatch runs may carry explicit
          # inputs (intake_priority) and are never cancelled.
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/state-materializer.yml/runs?event=schedule&per_page=100" \
            --jq ".workflow_runs[] | select(.conclusion == null) | select(.id != $GITHUB_RUN_ID) | select(.run_number < $GITHUB_RUN_NUMBER) | .id" |
            while IFS= read -r run_id; do
              # A run whose drain job already executes holds real progress;
              # runs with only queued/waiting jobs (or none) are superseded.
              in_progress_jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
                --jq '[.jobs[] | select(.status == "in_progress")] | length')"
              if [ "$in_progress_jobs" -gt 0 ]; then
                echo "Keeping run $run_id: a job is already in progress."
                continue
              fi
              echo "Cancelling superseded scheduled run $run_id: this run drains the same append window."
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel"
            done

  materialize:
    name: Drain queued state into one commit
    runs-on: ubuntu-latest
    # 60 minutes proved too tight once the queue runs deep: a late coordinator
    # grant plus one push-contention recovery cycle (~7-8 min of re-fetching on
    # the 39.5 GiB state repo per rejected atomic push) repeatedly ate the whole
    # job (runs 30219467540, 30221544369 cancelled at the kill line). Give the
    # drain room for a deep window plus several recovery cycles; the dedupe job
    # keeps the queue short so long runs no longer starve followers.
    timeout-minutes: 180
    concurrency:
      group: clawsweeper-state-materializer
      cancel-in-progress: false
      queue: max
    env:
      CLAWSWEEPER_MODEL_RECOVERY_ENABLED: "1"
      # Priority intent wins a slot quickly; a long acquire budget just lets one
      # contended wait eat the whole run (observed: six consecutive 20-min
      # timeout-cancels while the append window grew to ~25k rows).
      CLAWSWEEPER_STATE_LEASE_ACQUIRE_TIMEOUT_MS: "300000"
      # The durable-ticket queue can legitimately run tens of minutes deep
      # behind the long-tail writers (run 29996334590 waited 31 minutes for
      # seq 2284). 35 minutes of waiting still leaves a late grant enough of
      # the 60-minute job for one publish and the finalize steps; a clean
      # timeout beats a job kill either way.
      CLAWSWEEPER_STATE_COORDINATOR_ACQUIRE_TIMEOUT_MS: "2100000"
      CLAWSWEEPER_STATE_LEASE_PRIORITY: "1"
      CLAWSWEEPER_STATE_LEASE_TTL_MS: "1200000"
      # Sized to the 180-minute job: leave ~20 minutes of headroom for the
      # coordinator wait, finalize, and action-event publication steps.
      CLAWSWEEPER_STATE_MATERIALIZER_MAX_RUNTIME_MS: "9600000"
      # 2k publishes cleanly against the shallow state checkout (run 29913644079
      # committed 1974 paths); 10k batches are rejected at push with
      # "atomic push failed ... status: 5". Size to what demonstrably lands.
      CLAWSWEEPER_STATE_MATERIALIZER_MAX_ROWS: "2500"
      CLAWSWEEPER_STATE_MATERIALIZER_MAX_BYTES: "62914560"
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false

      - name: Create dispatch token
        id: dispatch-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.CLAWSWEEPER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: openclaw
          repositories: clawsweeper
          permission-actions: write
          permission-contents: read

      - uses: ./.github/actions/setup-action-ledger
        continue-on-error: true

      - name: Create state token
        id: state-token
        uses: ./.github/actions/create-state-token
        with:
          client-id: ${{ env.CLAWSWEEPER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}

      - uses: ./.github/actions/setup-state
        with:
          coordinator-enabled: ${{ vars.CLAWSWEEPER_STATE_COORDINATOR_ENABLED || 'false' }}
          coordinator-url: ${{ vars.CLAWSWEEPER_EXACT_REVIEW_QUEUE_URL || 'https://clawsweeper.openclaw.ai' }}
          ledger-source: ${{ vars.CLAWSWEEPER_LEDGER_SOURCE || 'git' }}
          records-source: ${{ vars.CLAWSWEEPER_RECORDS_SOURCE || 'git' }}
          records-url: ${{ vars.CLAWSWEEPER_EXACT_REVIEW_QUEUE_URL || 'https://clawsweeper.openclaw.ai' }}
          records-secret: ${{ secrets.CLAWSWEEPER_WEBHOOK_SECRET }}
          # The materializer is the designated bulk writer of the single-writer
          # plan (RFC #738). In the ordinary lane it starves behind batch-class
          # turns (run 30003798477 timed out after 35 minutes at queue
          # position 3); the batch lane's two-turn cap still guarantees
          # ordinary writers a slot.
          coordinator-class: ${{ inputs.intake_priority && 'cluster_intake' || 'publication_batch' }}
          token: ${{ steps.state-token.outputs.token }}
          # depth-1 cannot fast-forward or rebuild against a branch other
          # writers keep advancing (non-fast-forward shallow push rejections,
          # runs 29938808338 / 29957012043); a full clone of `state`'s own
          # (large) history times out. The state branch can advance by hundreds
          # of commits between 20-minute cycles, so keep one recovery-sized
          # window available without cloning the full history.
          fetch-depth: 512

      - uses: ./.github/actions/setup-pnpm
        with:
          build-script: build:all

      - uses: ./.github/actions/setup-codex
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAWSWEEPER_INTERNAL_MODEL: ${{ secrets.CLAWSWEEPER_MODEL }}
        with:
          auth-mode: login

      - name: Materialize queued state
        env:
          GH_TOKEN: ${{ steps.dispatch-token.outputs.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAWSWEEPER_STATE_REPO_TOKEN: ${{ steps.state-token.outputs.token }}
          CLAWSWEEPER_WEBHOOK_SECRET: ${{ secrets.CLAWSWEEPER_WEBHOOK_SECRET }}
          QUEUE_URL: ${{ vars.CLAWSWEEPER_EXACT_REVIEW_QUEUE_URL || 'https://clawsweeper.openclaw.ai' }}
          CLAWSWEEPER_REPO: openclaw/clawsweeper
          # Dispatch workers at the materializer's own ref so the restore and
          # receipt code lines up with the dispatching revision (this is
          # `main` for every scheduled production run).
          CLAWSWEEPER_DISPATCH_REF: ${{ github.ref_name }}
          CLAWSWEEPER_WORKER_RUNNER: ${{ vars.CLAWSWEEPER_WORKER_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
          CLAWSWEEPER_EXECUTION_RUNNER: ${{ vars.CLAWSWEEPER_EXECUTION_RUNNER || 'blacksmith-16vcpu-ubuntu-2404' }}
        run: node dist/repair/state-materializer.js

      - name: Finalize materializer recovery action ledger
        if: ${{ always() }}
        run: pnpm run --silent finalize-action-events

      - name: Publish materializer recovery action events
        if: ${{ always() }}
        env:
          CLAWSWEEPER_MODEL_RECOVERY_ENABLED: "0"
          CLAWSWEEPER_STATE_APPEND_ENABLED: "1"
          CLAWSWEEPER_STATE_REPO_TOKEN: ${{ steps.state-token.outputs.token }}
          CLAWSWEEPER_WEBHOOK_SECRET: ${{ secrets.CLAWSWEEPER_WEBHOOK_SECRET }}
          QUEUE_URL: ${{ vars.CLAWSWEEPER_EXACT_REVIEW_QUEUE_URL || 'https://clawsweeper.openclaw.ai' }}
        run: |
          set -euo pipefail
          if [ -z "${CLAWSWEEPER_ACTION_LEDGER_OUTPUT_ROOT:-}" ]; then
            echo "Materializer recovery action ledger is disabled."
            exit 0
          fi
          source_root="$CLAWSWEEPER_ACTION_LEDGER_OUTPUT_ROOT"
          if [ ! -d "$source_root/ledger" ]; then
            echo "No materializer recovery action events were finalized."
            exit 0
          fi
          event_paths_file=".artifacts/materializer-recovery-action-ledger-paths.txt"
          mkdir -p .artifacts
          pnpm run --silent publish-action-events -- \
            --source-root "$source_root" \
            --state-root "$CLAWSWEEPER_STATE_DIR" \
            --expected-producer-job "$GITHUB_JOB" |
            jq -r '.paths[]?' |
            sort -u > "$event_paths_file"
          if [ ! -s "$event_paths_file" ]; then
            echo "Materializer recovery events existed but no paths were imported." >&2
            exit 1
          fi
          while IFS= read -r event_path; do
            durable_event_path="$CLAWSWEEPER_STATE_DIR/$event_path"
            test -f "$durable_event_path"
            mkdir -p "$(dirname "$event_path")"
            cp "$durable_event_path" "$event_path"
          done < "$event_paths_file"
          node dist/clawsweeper.js publish-action-event-paths \
            --paths-file "$event_paths_file" \
            --message "chore: append materializer recovery action ledger"
