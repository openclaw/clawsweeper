name: Coverage credential probe

# Manual diagnostic only. No inputs, scheduled/event triggers or production writes.
on:
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  paired-read:
    # Evaluated before checkout or any step can access credentials.
    if: github.repository == 'openclaw/clawsweeper' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          node-version: "24.22.1"
          pnpm-version: "12.15.0"
          build-script: build:repair
      - name: Create existing owner inventory metadata-read token
        id: inventory
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liOECG0slfuhz093
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: openclaw
          permission-metadata: read
      - name: Paired fixed public reads
        # A is read-equivalent installation/repo capability, not production token
        # bytes or full write grants. B has no fallback if minting failed.
        env:
          COVERAGE_PROBE_TOKEN_A: ${{ github.token }}
          COVERAGE_PROBE_TOKEN_B: ${{ steps.inventory.outputs.token }}
          GITHUB_SHA: ${{ github.sha }}
        run: node dist/repair/coverage-credential-probe.js
      - name: Closed aggregate summary
        if: ${{ always() }}
        shell: bash
        run: |
          if [ -f coverage-credential-probe.json ]; then
            printf '%s\n' '## Coverage credential probe' 'Observations only; not production health or causal proof.' '```json' >> "$GITHUB_STEP_SUMMARY"
            cat coverage-credential-probe.json >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' '```' >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'Coverage credential probe incomplete: no result artifact.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Exact redacted result only
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-credential-probe
          path: coverage-credential-probe.json
          if-no-files-found: error
          retention-days: 3
