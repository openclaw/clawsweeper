name: GitHub scale canary

# Alerts when a GitHub API limit starts breaking reviews, or when a target
# repository nears a limit a ClawSweeper reader is bounded by. See
# docs/github-api-limits.md.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Evaluate without posting an alert"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: github-scale-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm
        with:
          build-script: build:repair

      # Alerts already sent today, carried between hourly runs so an ongoing
      # incident alerts once per finding set per day.
      - name: Resolve alert-state key
        id: state
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore sent alerts
        uses: actions/cache/restore@v6
        with:
          path: .artifacts/scale-canary-sent.txt
          key: github-scale-canary-sent-${{ steps.state.outputs.day }}-${{ github.run_id }}
          restore-keys: github-scale-canary-sent-${{ steps.state.outputs.day }}-

      - name: Ensure sent-alert file
        run: mkdir -p .artifacts && touch .artifacts/scale-canary-sent.txt

      - name: Check GitHub limits and review failures
        env:
          CLAWSWEEPER_SCALE_CANARY_SENT_FILE: .artifacts/scale-canary-sent.txt
          GH_TOKEN: ${{ github.token }}
          TARGET_REPOS: ${{ vars.CLAWSWEEPER_SCALE_CANARY_REPOS || 'openclaw/openclaw' }}
          CLAWSWEEPER_OPENCLAW_HOOK_URL: ${{ secrets.CLAWSWEEPER_OPENCLAW_HOOK_URL }}
          CLAWSWEEPER_OPENCLAW_HOOK_TOKEN: ${{ secrets.CLAWSWEEPER_OPENCLAW_HOOK_TOKEN }}
          CLAWSWEEPER_OPENCLAW_AGENT_ID: ${{ vars.CLAWSWEEPER_OPENCLAW_AGENT_ID || 'clawsweeper' }}
          CLAWSWEEPER_DISCORD_TARGET: ${{ vars.CLAWSWEEPER_DISCORD_TARGET || 'channel:1456744319972282449' }}
          CLAWSWEEPER_SCALE_CANARY_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
        run: pnpm run repair:github-scale-canary

      - uses: actions/cache/save@v6
        if: always()
        with:
          path: .artifacts/scale-canary-sent.txt
          key: github-scale-canary-sent-${{ steps.state.outputs.day }}-${{ github.run_id }}
