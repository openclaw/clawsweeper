name: Maintain exact review queue

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Reconcile lineages, retire one verified closed publication, or report storage by table (read-only)"
        required: true
        type: choice
        options: [reconcile, retire-closed-publication, storage-stats]
        default: reconcile
      execute:
        description: "Apply one bounded pass (false runs a dry-run)"
        required: true
        type: boolean
        default: false
      passes:
        description: "Deprecated compatibility input; accepted but clamped to one pass"
        required: true
        type: string
        default: "1"
      max_items:
        description: "Maximum reconciliation candidates to inspect"
        required: true
        type: number
        default: 1
      producer_run_id:
        description: "Retirement only: exact producer run ID"
        type: string
      artifact_id:
        description: "Retirement only: exact producer artifact ID"
        type: string
      publication_key_sha256:
        description: "Retirement only: approved publication-key SHA256"
        type: string
      queue_revision:
        description: "Retirement only: approved publication queue revision"
        type: string
      reviewed_plan_sha256:
        description: "Retirement execute requires the reviewed preview plan SHA256"
        type: string

concurrency:
  group: exact-review-queue-maintenance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  storage-stats:
    if: ${{ inputs.mode == 'storage-stats' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXACT_REVIEW_QUEUE_URL: ${{ vars.CLAWSWEEPER_EXACT_REVIEW_QUEUE_URL || 'https://clawsweeper.openclaw.ai' }}
    steps:
      # Read-only: one signed request; the queue counts rows and samples row sizes per table.
      - name: Report queue storage by table
        env:
          CLAWSWEEPER_WEBHOOK_SECRET: ${{ secrets.CLAWSWEEPER_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          body='{}'
          signature="sha256=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$CLAWSWEEPER_WEBHOOK_SECRET" -hex | awk '{print $NF}')"
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "content-type: application/json" \
            -H "x-clawsweeper-exact-review-signature: $signature" \
            --data "$body" "$EXACT_REVIEW_QUEUE_URL/internal/exact-review/storage-stats" > stats.json
          jq . stats.json
          jq -e '
            .ok == true and
            (.generated_at | type == "string" and length > 0) and
            (.storage | type == "object" and has("databaseBytes")) and
            (.storage.databaseBytes | . == null or (type == "number" and . >= 0)) and
            (.storage.estimatedTableBytes | type == "number" and . >= 0) and
            (.storage.tables | type == "array" and all(.[];
              (.table | type == "string" and length > 0) and
              (.rows | type == "number" and . >= 0) and
              (.averageRowBytes | type == "number" and . >= 0) and
              (.estimatedBytes | type == "number" and . >= 0)
            ))
          ' stats.json >/dev/null
          {
            echo "### Queue storage by table"
            echo
            jq -r '"Generated: \(.generated_at) · database: \(.storage.databaseBytes // "unknown") bytes · estimated table content: \(.storage.estimatedTableBytes) bytes"' stats.json
            echo
            echo "Content estimates use sampled column lengths; indexes and SQLite overhead are excluded."
            echo
            echo "| Table | Rows | Estimated avg row bytes | Estimated content bytes |"
            echo "|---|---:|---:|---:|"
            jq -r '.storage.tables[] | "| \(.table) | \(.rows) | \(.averageRowBytes) | \(.estimatedBytes) |"' stats.json
          } >> "$GITHUB_STEP_SUMMARY"

  reconcile:
    if: ${{ inputs.mode == 'reconcile' || inputs.mode == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXACT_REVIEW_QUEUE_URL: ${{ vars.CLAWSWEEPER_EXACT_REVIEW_QUEUE_URL || 'https://clawsweeper.openclaw.ai' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm
        with:
          build-script: build:repair

      - name: Preview or reconcile historical publication lineages
        env:
          CLAWSWEEPER_WEBHOOK_SECRET: ${{ secrets.CLAWSWEEPER_WEBHOOK_SECRET }}
          EXECUTE: ${{ inputs.execute }}
          PASSES: ${{ inputs.passes }}
          MAX_ITEMS: ${{ inputs.max_items }}
        run: |
          args=(--max-items "$MAX_ITEMS")
          if [[ "$EXECUTE" == "true" ]]; then
            args+=(--apply)
          fi
          args+=(--passes "$PASSES")
          pnpm run --silent repair:exact-review-queue-maintenance -- "${args[@]}"

  retire-closed-publication:
    if: ${{ inputs.mode == 'retire-closed-publication' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          filter: blob:none
          fetch-depth: 1
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm
        with:
          build-script: build:repair

      - name: Prepare closed publication retirement
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCER_RUN_ID: ${{ inputs.producer_run_id }}
          ARTIFACT_ID: ${{ inputs.artifact_id }}
          PUBLICATION_KEY_SHA256: ${{ inputs.publication_key_sha256 }}
          QUEUE_REVISION: ${{ inputs.queue_revision }}
        run: |
          pnpm run --silent repair:exact-review-queue-maintenance retire-closed-publication \
            --producer-run-id "$PRODUCER_RUN_ID" \
            --artifact-id "$ARTIFACT_ID" \
            --publication-key-sha256 "$PUBLICATION_KEY_SHA256" \
            --queue-revision "$QUEUE_REVISION" \
            --plan-file "$RUNNER_TEMP/closed-publication-retirement.json"

      - name: Assert reviewed closed publication retirement
        if: ${{ inputs.execute }}
        env:
          CLAWSWEEPER_WEBHOOK_SECRET: ${{ secrets.CLAWSWEEPER_WEBHOOK_SECRET }}
          EXACT_REVIEW_QUEUE_URL: ${{ vars.CLAWSWEEPER_EXACT_REVIEW_QUEUE_URL || 'https://clawsweeper.openclaw.ai' }}
          REVIEWED_PLAN_SHA256: ${{ inputs.reviewed_plan_sha256 }}
        run: |
          pnpm run --silent repair:exact-review-queue-maintenance retire-closed-publication \
            --apply \
            --reviewed-plan-sha256 "$REVIEWED_PLAN_SHA256" \
            --plan-file "$RUNNER_TEMP/closed-publication-retirement.json"
