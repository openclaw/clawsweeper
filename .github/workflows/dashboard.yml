name: ClawSweeper Live Dashboard

on:
  workflow_dispatch:
    inputs:
      tail_activity_minutes:
        description: "Observe redacted activity outcomes instead of deploying (0 deploys; 1–5 minutes tails)"
        type: number
        default: 0
  push:
    branches: [main]
    paths:
      - "dashboard/**"
      - "src/repair/github-activity.ts"
      - "src/repair/openclaw-hook.ts"
      - "src/repair/json-types.ts"
      - "src/clawsweeper-bot-identity.ts"
      - "src/value-coerce.ts"
      - "scripts/dashboard-refresh-ci.mjs"
      - "scripts/dashboard-smoke.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/dashboard-ci.yml"
      - ".github/workflows/dashboard.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.tail_activity_minutes > 0 && 'clawsweeper-activity-tail' || 'clawsweeper-live-dashboard' }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy dashboard Worker
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.tail_activity_minutes == 0 }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: 91b59577e757131d68d55a471fe32aca
      CLOUDFLARE_WORKER_NAME: clawsweeper-status
      CLOUDFLARE_API_TOKEN: ${{ secrets.OPENCLAW_CLOUDFLARE_WORKERS_API_TOKEN || secrets.OPENCLAW_CLOUDFLARE_API_TOKEN }}
      CF_API_TOKEN: ${{ secrets.OPENCLAW_CLOUDFLARE_WORKERS_API_TOKEN || secrets.OPENCLAW_CLOUDFLARE_API_TOKEN }}
      CLAWSWEEPER_STATUS_URL: https://clawsweeper.openclaw.ai
      CLAWSWEEPER_EXPECTED_DEPLOY_SHA: ${{ github.sha }}
      CLAWSWEEPER_STATUS_INGEST_TOKEN: ${{ secrets.CLAWSWEEPER_STATUS_INGEST_TOKEN }}
      CLAWSWEEPER_APP_PRIVATE_KEY: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
      CLAWSWEEPER_WEBHOOK_SECRET: ${{ secrets.CLAWSWEEPER_WEBHOOK_SECRET }}
      CLAWSWEEPER_OPENCLAW_HOOK_URL: ${{ secrets.CLAWSWEEPER_OPENCLAW_HOOK_URL }}
      CLAWSWEEPER_OPENCLAW_HOOK_TOKEN: ${{ secrets.CLAWSWEEPER_OPENCLAW_HOOK_TOKEN }}
      CLAWSWEEPER_DISCORD_TARGET: ${{ vars.CLAWSWEEPER_DISCORD_TARGET }}
      CLAWSWEEPER_OPENCLAW_AGENT_ID: ${{ vars.CLAWSWEEPER_OPENCLAW_AGENT_ID || 'clawsweeper' }}
      CLAWSWEEPER_GITHUB_ACTIVITY_FROM_WEBHOOK: ${{ vars.CLAWSWEEPER_GITHUB_ACTIVITY_FROM_WEBHOOK || '0' }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pnpm

      - name: Verify Cloudflare token is configured
        run: test -n "$CLOUDFLARE_API_TOKEN"

      - name: Prepare deploy config
        id: dashboard-config
        run: |
          test -n "$CLAWSWEEPER_STATUS_INGEST_TOKEN"
          cp dashboard/wrangler.toml dashboard/wrangler.deploy.toml
          printf 'INGEST_TOKEN = "%s"\n' "$CLAWSWEEPER_STATUS_INGEST_TOKEN" >> dashboard/wrangler.deploy.toml
          printf 'CLAWSWEEPER_DEPLOY_SHA = "%s"\n' "$GITHUB_SHA" >> dashboard/wrangler.deploy.toml
          node -e '
            const fs = require("node:fs");
            const names = ["CLAWSWEEPER_DISCORD_TARGET", "CLAWSWEEPER_OPENCLAW_AGENT_ID", "CLAWSWEEPER_GITHUB_ACTIVITY_FROM_WEBHOOK"];
            const lines = names.map((name) => `${name} = ${JSON.stringify(process.env[name] || "")}\n`).join("");
            fs.appendFileSync("dashboard/wrangler.deploy.toml", lines);
          '
          echo "config=dashboard/wrangler.deploy.toml" >> "$GITHUB_OUTPUT"

      - name: Sync Worker secrets
        run: |
          set -euo pipefail
          test -n "$CLAWSWEEPER_APP_PRIVATE_KEY"
          test -n "$CLAWSWEEPER_WEBHOOK_SECRET"
          secrets_file="$RUNNER_TEMP/clawsweeper-worker-secrets.json"
          response_file="$RUNNER_TEMP/clawsweeper-worker-secrets-response.json"
          trap 'rm -f "$secrets_file" "$response_file"' EXIT
          node -e '
            const fs = require("node:fs");
            const names = [
              "CLAWSWEEPER_APP_PRIVATE_KEY",
              "CLAWSWEEPER_WEBHOOK_SECRET",
              "CLAWSWEEPER_OPENCLAW_HOOK_URL",
              "CLAWSWEEPER_OPENCLAW_HOOK_TOKEN",
            ];
            const secrets = Object.fromEntries(
              names.flatMap((name) => {
                const text = process.env[name] || "";
                if (!text) {
                  const optional = process.env.CLAWSWEEPER_GITHUB_ACTIVITY_FROM_WEBHOOK !== "1" &&
                    name.startsWith("CLAWSWEEPER_OPENCLAW_HOOK_");
                  if (optional) return [];
                  process.exit(2);
                }
                return [[name, { name, text, type: "secret_text" }]];
              }),
            );
            fs.writeFileSync(process.argv[1], JSON.stringify({ secrets }));
          ' "$secrets_file"
          http_status="$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --request PATCH \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header "Content-Type: application/merge-patch+json" \
              --data-binary @"$secrets_file" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$CLOUDFLARE_WORKER_NAME/secrets-bulk"
          )"
          if [[ "$http_status" != 2* ]] || ! jq -e '.success == true' "$response_file" >/dev/null; then
            echo "Cloudflare secret sync failed with HTTP $http_status" >&2
            jq '{errors, messages}' "$response_file" >&2 || true
            exit 1
          fi

      - name: Deploy Worker
        run: npx wrangler@4.131.1 deploy --config "${{ steps.dashboard-config.outputs.config }}"

      - name: Smoke test live dashboard
        run: pnpm run dashboard:smoke -- "$CLAWSWEEPER_STATUS_URL"

  observe-activity:
    name: Observe redacted activity outcomes
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.tail_activity_minutes > 0 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.OPENCLAW_CLOUDFLARE_WORKERS_API_TOKEN || secrets.OPENCLAW_CLOUDFLARE_API_TOKEN }}
      TAIL_MINUTES: ${{ inputs.tail_activity_minutes }}
    steps:
      - uses: actions/checkout@v7
      - name: Tail only redacted activity outcomes
        run: |
          set -euo pipefail
          [[ "$TAIL_MINUTES" =~ ^[1-5]$ ]]
          test -n "$CLOUDFLARE_API_TOKEN"
          tail_errors="$RUNNER_TEMP/activity-tail-errors"
          trap 'rm -f "$tail_errors"' EXIT
          set +e
          timeout --signal=TERM --kill-after=10s "${TAIL_MINUTES}m" \
            npx --yes wrangler@4.131.1 tail --config dashboard/wrangler.toml \
              --format json --search github_activity_hook 2>"$tail_errors" |
            node scripts/github-activity-tail.mjs
          statuses=("${PIPESTATUS[@]}")
          set -e
          test "${statuses[1]}" -eq 0
          if [ "${statuses[0]}" -ne 0 ] && [ "${statuses[0]}" -ne 124 ]; then
            echo "Activity observation failed; raw tail diagnostics are intentionally withheld." >&2
            exit 1
          fi
