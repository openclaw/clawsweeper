name: Publish exact review batch

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Claim and publish one batch"
        required: true
        type: boolean
        default: false
      dispatch_id:
        description: "Durable dispatcher reservation identifier"
        required: false
        type: string
      dispatched_at:
        description: "UTC timestamp for the dispatcher reservation"
        required: false
        type: string

permissions:
  actions: write
  contents: read

jobs:
  publish:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' && inputs.execute
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXACT_REVIEW_QUEUE_URL: ${{ vars.CLAWSWEEPER_EXACT_REVIEW_QUEUE_URL || 'https://clawsweeper.openclaw.ai' }}
      CLAWSWEEPER_AUTO_CLOSE_REASONS: ${{ vars.CLAWSWEEPER_AUTO_CLOSE_REASONS || 'all' }}
      CLAWSWEEPER_UNCONFIRMED_PRODUCT_DIRECTION_CLOSE_ENABLED: ${{ vars.CLAWSWEEPER_UNCONFIRMED_PRODUCT_DIRECTION_CLOSE_ENABLED || 'false' }}
      CLAWSWEEPER_UNSPONSORED_FEATURE_CLOSE_ENABLED: ${{ vars.CLAWSWEEPER_UNSPONSORED_FEATURE_CLOSE_ENABLED || 'false' }}
      CLAWSWEEPER_STALE_VERSION_BUG_CLOSE_ENABLED: ${{ vars.CLAWSWEEPER_STALE_VERSION_BUG_CLOSE_ENABLED || 'false' }}
      CLAWSWEEPER_OBSOLETE_FIX_PR_CLOSE_ENABLED: ${{ vars.CLAWSWEEPER_OBSOLETE_FIX_PR_CLOSE_ENABLED || 'false' }}
      CLAWSWEEPER_AUTHOR_PR_BUDGET: ${{ vars.CLAWSWEEPER_AUTHOR_PR_BUDGET || '15' }}
      CLAWSWEEPER_AUTHOR_PR_BUDGET_MAX_CLOSES_PER_RUN: ${{ vars.CLAWSWEEPER_AUTHOR_PR_BUDGET_MAX_CLOSES_PER_RUN || '5' }}
      CLAWSWEEPER_IDEA_REVIVAL_REACTIONS: ${{ vars.CLAWSWEEPER_IDEA_REVIVAL_REACTIONS || '5' }}
      EXACT_REVIEW_BATCH_ID: exact-review-batch:${{ github.run_id }}
      EXACT_REVIEW_BATCH_LEASE_OWNER: github:${{ github.run_id }}
      EXACT_REVIEW_BATCH_DISPATCH_ID: ${{ inputs.dispatch_id }}
      EXACT_REVIEW_BATCH_DISPATCHED_AT: ${{ inputs.dispatched_at }}
      EXACT_REVIEW_BATCH_MANIFEST: .artifacts/exact-review-batch/manifest.json
      CLAWSWEEPER_GITHUB_RATE_LIMIT_OBSERVATION_PATH: .artifacts/exact-review-batch/github-rate-limits.jsonl
      CLAWSWEEPER_GITHUB_REQUEST_METRICS_PATH: .artifacts/exact-review-batch/github-request-metrics.jsonl
      # Scan the full queue window so owner filtering can still fill the 32-item lease cap.
      EXACT_REVIEW_BATCH_MAX_ITEMS: "50"
      EXACT_REVIEW_BATCH_PREPARE_CONCURRENCY: "1"
      CLAWSWEEPER_APP_CLIENT_ID: Iv23liOECG0slfuhz093
      CLAWSWEEPER_APP_PRIVATE_KEY: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
    steps:
      - name: Capture runner start timestamp
        run: echo "EXACT_REVIEW_BATCH_RUNNER_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          ref: main
          filter: blob:none
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm
        with:
          build-script: build:all

      - uses: ./.github/actions/setup-github-egress-observer
        id: github-egress-observer
        continue-on-error: true
        with:
          metrics-path: .artifacts/exact-review-batch/github-egress-v2.jsonl
          rate-limit-path: .artifacts/exact-review-batch/github-rate-limit-details-v2.jsonl
          pool-class: repository_actions
          stage: publication_prepare
          source-action: exact_review_artifact_publish

      - name: Claim one durable publication batch
        id: batch
        env:
          CLAWSWEEPER_WEBHOOK_SECRET: ${{ secrets.CLAWSWEEPER_WEBHOOK_SECRET }}
        run: pnpm run --silent repair:exact-review-batch claim

      - name: Create target owner token
        if: ${{ steps.batch.outputs.claimed == 'true' && steps.batch.outputs.item_count != '0' }}
        id: target-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.CLAWSWEEPER_APP_CLIENT_ID }}
          private-key: ${{ env.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: ${{ steps.batch.outputs.target_owner }}
          repositories: ${{ steps.batch.outputs.target_repositories }}
          permission-checks: read
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: read

      - name: Record batch preparation start
        if: ${{ steps.batch.outputs.claimed == 'true' && steps.batch.outputs.item_count != '0' }}
        continue-on-error: true
        env:
          CLAWSWEEPER_WEBHOOK_SECRET: ${{ secrets.CLAWSWEEPER_WEBHOOK_SECRET }}
          EXACT_REVIEW_BATCH_OBSERVATION: preparation_started
        run: pnpm run --silent repair:exact-review-batch observe

      - uses: ./.github/actions/setup-state
        if: ${{ steps.batch.outputs.claimed == 'true' && steps.batch.outputs.item_count != '0' }}
        with:
          coordinator-url: ${{ vars.CLAWSWEEPER_EXACT_REVIEW_QUEUE_URL || 'https://clawsweeper.openclaw.ai' }}
          records-url: ${{ vars.CLAWSWEEPER_EXACT_REVIEW_QUEUE_URL || 'https://clawsweeper.openclaw.ai' }}
          records-secret: ${{ secrets.CLAWSWEEPER_WEBHOOK_SECRET }}
          records-repo-slugs: ${{ steps.batch.outputs.records_repo_slugs }}
          hydrate-git-state: "false"
          hydrate-state-blobs: "false"

      - name: Install exact live-proof media validators
        if: ${{ steps.batch.outputs.claimed == 'true' && steps.batch.outputs.item_count != '0' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Prepare each item independently
        if: ${{ steps.batch.outputs.claimed == 'true' && steps.batch.outputs.item_count != '0' }}
        env:
          CLAWSWEEPER_WEBHOOK_SECRET: ${{ secrets.CLAWSWEEPER_WEBHOOK_SECRET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.CLAWSWEEPER_LIVE_PROOF_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLAWSWEEPER_LIVE_PROOF_AWS_SECRET_ACCESS_KEY }}
          CLAWSWEEPER_LIVE_PROOF_S3_ENDPOINT: ${{ secrets.CLAWSWEEPER_LIVE_PROOF_S3_ENDPOINT }}
          CLAWSWEEPER_LIVE_PROOF_BUCKET: ${{ secrets.CLAWSWEEPER_LIVE_PROOF_BUCKET }}
          CLAWSWEEPER_LIVE_PROOF_BASE_URL: ${{ secrets.CLAWSWEEPER_LIVE_PROOF_BASE_URL }}
          GH_TOKEN: ${{ steps.target-token.outputs.token }}
          REPO_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          heartbeat_failed=".artifacts/exact-review-batch/heartbeat-failed"
          rm -f "$heartbeat_failed"
          pnpm run --silent repair:exact-review-batch heartbeat
          (
            while sleep 60; do
              if ! pnpm run --silent repair:exact-review-batch heartbeat --tolerate-until-lease; then
                touch "$heartbeat_failed"
                exit 1
              fi
            done
          ) &
          heartbeat_pid=$!
          stop_heartbeat() {
            kill "$heartbeat_pid" 2>/dev/null || true
            wait "$heartbeat_pid" 2>/dev/null || true
          }
          trap stop_heartbeat EXIT
          EXACT_REVIEW_BATCH_HEARTBEAT_FAILURE_PATH="$heartbeat_failed" \
            node scripts/prepare-exact-review-batch.mjs
          test ! -f "$heartbeat_failed"

      - name: Record batch preparation finish
        if: ${{ always() && steps.batch.outputs.claimed == 'true' && steps.batch.outputs.item_count != '0' }}
        continue-on-error: true
        env:
          CLAWSWEEPER_WEBHOOK_SECRET: ${{ secrets.CLAWSWEEPER_WEBHOOK_SECRET }}
          EXACT_REVIEW_BATCH_OBSERVATION: preparation_finished
        run: pnpm run --silent repair:exact-review-batch observe

      - name: Finalize healthy members under a fenced heartbeat
        if: ${{ steps.batch.outputs.claimed == 'true' && steps.batch.outputs.item_count != '0' }}
        env:
          CLAWSWEEPER_WEBHOOK_SECRET: ${{ secrets.CLAWSWEEPER_WEBHOOK_SECRET }}
          GH_TOKEN: ${{ github.token }}
          AUTO_IMPLEMENT_ISSUES: ${{ vars.CLAWSWEEPER_AUTO_IMPLEMENT_ISSUES }}
          MAX_DISPATCH: ${{ vars.CLAWSWEEPER_AUTO_IMPLEMENT_MAX_DISPATCH_PER_SWEEP || '' }}
          CLAWSWEEPER_COMMENT_LOOKBACK_MINUTES: ${{ vars.CLAWSWEEPER_COMMENT_LOOKBACK_MINUTES || '180' }}
          CLAWSWEEPER_COMMENT_MAX_COMMENTS: ${{ vars.CLAWSWEEPER_COMMENT_MAX_COMMENTS || '1000' }}
        run: |
          set -euo pipefail
          heartbeat_failed=".artifacts/exact-review-batch/heartbeat-failed"
          rm -f "$heartbeat_failed"
          pnpm run --silent repair:exact-review-batch heartbeat
          (
            while sleep 60; do
              if ! pnpm run --silent repair:exact-review-batch heartbeat --tolerate-until-lease; then
                touch "$heartbeat_failed"
                exit 1
              fi
            done
          ) &
          heartbeat_pid=$!
          stop_heartbeat() {
            kill "$heartbeat_pid" 2>/dev/null || true
            wait "$heartbeat_pid" 2>/dev/null || true
          }
          trap stop_heartbeat EXIT

          pnpm run --silent repair:exact-review-batch commit
          test ! -f "$heartbeat_failed"
          receipt_path="$(dirname "$EXACT_REVIEW_BATCH_MANIFEST")/state-receipt.json"
          remaining_implementations="$MAX_DISPATCH"
          if [ -z "$remaining_implementations" ]; then
            if ! remaining_implementations="$(pnpm run --silent workflow -- limit issue_implementation.dispatches_per_sweep_default)"; then
              echo "::warning::Unable to resolve the automatic issue implementation dispatch limit; scheduled backfill will retry."
              remaining_implementations=0
            fi
          fi
          if ! [[ "$remaining_implementations" =~ ^[0-9]+$ ]] || [ "$remaining_implementations" -gt 100 ]; then
            echo "::warning::Invalid automatic issue implementation dispatch limit; scheduled backfill will retry."
            remaining_implementations=0
          fi
          jq -c '.items[]' "$EXACT_REVIEW_BATCH_MANIFEST" | while IFS= read -r item; do
            test ! -f "$heartbeat_failed"
            outcome_path="$(jq -r '.outcomePath' <<<"$item")"
            [ -f "$outcome_path" ] || continue
            outcome_kind="$(jq -r '.kind // empty' "$outcome_path")"
            fence_key="$(jq -r '.itemKey' <<<"$item")"
            receipt_outcome="$(jq -r --arg fence_key "$fence_key" \
              '[.outcomes[]? | select(.fenceKey == $fence_key) | .outcome] | last // empty' \
              "$receipt_path")"
            if [ "$outcome_kind" = "eligible" ]; then
              if [ "$receipt_outcome" != "accepted" ] && [ "$receipt_outcome" != "deduped" ] && \
                [ "$receipt_outcome" != "superseded" ] && [ "$receipt_outcome" != "permanent" ]; then
                continue
              fi
            elif [ "$outcome_kind" != "superseded" ] && [ "$outcome_kind" != "permanent_failure" ]; then
              continue
            fi
            target_repo="$(jq -r '.decision.targetRepo' <<<"$item")"
            target_branch="$(jq -r '.decision.targetBranch' <<<"$item")"
            item_number="$(jq -r '.decision.itemNumber' <<<"$item")"
            source_action="$(jq -r '.decision.publication.producerDecision.sourceAction' <<<"$item")"
            repeat_revision="$(jq -r '.repeatRevision == true' <<<"$item")"
            claim_generation="$(jq -r '.claimGeneration' <<<"$item")"
            fence_key="$(jq -r '.itemKey' <<<"$item")"
            revision="$(jq -r '.revision' <<<"$item")"
            export TARGET_REPO="$target_repo" ITEM_NUMBER="$item_number" FENCE_KEY="$fence_key" REVISION="$revision"
            export EXACT_REVIEW_GITHUB_REQUEST_REPEAT="$repeat_revision"
            export CLAWSWEEPER_GITHUB_POOL_CLASS=repository_actions
            export CLAWSWEEPER_GITHUB_STAGE=publication_router
            export CLAWSWEEPER_GITHUB_SOURCE_ACTION="$source_action"
            export CLAWSWEEPER_GITHUB_CLAIM_GENERATION="$claim_generation"
            export CLAWSWEEPER_GITHUB_REQUEST_REPEAT="$repeat_revision"
            lifecycle_terminal=""
            lifecycle_router_outcome=""
            lifecycle_deferred_coverage="false"
            if [ "$receipt_outcome" = "superseded" ]; then
              lifecycle_terminal="superseded"
            elif jq -e '.disposition.requeueLatestExpected == true' "$outcome_path" >/dev/null; then
              delivery_id="publisher-source-drift:$(jq -r '.itemKey' <<<"$item"):$(jq -r '.revision' <<<"$item")"
              producer_decision="$(jq -c '.decision.publication.producerDecision' <<<"$item")"
              payload="$(jq -cn \
                --arg delivery_id "$delivery_id" \
                --arg source_action "$source_action" \
                --argjson decision "$producer_decision" \
                '{
                  delivery_id: $delivery_id,
                  decision: ($decision + {
                    sourceAction: (if $source_action == "failed_review_shard_recovery" or $source_action == "command_proof_result" then $source_action else "source_drift_requeue" end),
                    supersedesInProgress: true
                  })
                }')"
              post_effect_payload="${outcome_path}.post-effect.json"
              printf '%s' "$payload" > "$post_effect_payload"
              response="$(pnpm run --silent repair:exact-review-batch post-effect --route enqueue --payload "$post_effect_payload")"
              jq -e '.ok == true and (.queued == true or .deduped == true or .shed == true)' <<<"$response" >/dev/null
              lifecycle_terminal="requeue"
            elif jq -e '.disposition.terminalMissingExpected == true' "$outcome_path" >/dev/null; then
              lifecycle_terminal="target_missing"
            elif jq -e '.disposition.terminalClosedExpected == true' "$outcome_path" >/dev/null; then
              lifecycle_terminal="target_closed"
            elif jq -e '.disposition.guardedOpenAction != null and .disposition.guardedOpenAction != ""' "$outcome_path" >/dev/null; then
              lifecycle_terminal="guarded_open"
            elif [ "$outcome_kind" = "permanent_failure" ] || [ "$receipt_outcome" = "permanent" ]; then
              # A permanent publisher result remains retryable until the durable
              # queue decides whether it requeues or reaches dead-letter. The
              # later guarded acknowledgement reads that terminal projection.
              continue
            elif [ "$outcome_kind" = "superseded" ]; then
              lifecycle_terminal="superseded"
            elif [ "$source_action" = "failed_review_shard_recovery" ]; then
              lifecycle_router_outcome="not_required"
            elif jq -e '.disposition.routableSyncExpected == true' "$outcome_path" >/dev/null; then
              github_apply_error="$(mktemp)"
              if gh workflow run repair-comment-router.yml \
                --repo "$GITHUB_REPOSITORY" \
                --ref main \
                -f execute=true \
                -f target_repo="$target_repo" \
                -f target_branch="$target_branch" \
                -f item_numbers="$item_number" \
                -f lookback_minutes="$CLAWSWEEPER_COMMENT_LOOKBACK_MINUTES" \
                -f max_comments="$CLAWSWEEPER_COMMENT_MAX_COMMENTS" \
                2>"$github_apply_error"; then
                EXACT_REVIEW_GITHUB_RATE_LIMIT_SCOPE=repository_actions \
                  EXACT_REVIEW_GITHUB_REQUEST_OUTCOME=success \
                  pnpm run --silent repair:exact-review-batch request-metric
                rm -f "$github_apply_error"
              else
                github_apply_status=$?
                if grep -Eqi 'rate limit|abuse detection|was submitted too quickly|HTTP 429' "$github_apply_error"; then
                  EXACT_REVIEW_GITHUB_RATE_LIMIT_SCOPE=repository_actions \
                    pnpm run --silent repair:exact-review-batch rate-limit || true
                  EXACT_REVIEW_BATCH_OBSERVATION=github_throttle \
                    pnpm run --silent repair:exact-review-batch observe || true
                else
                  EXACT_REVIEW_GITHUB_RATE_LIMIT_SCOPE=repository_actions \
                    EXACT_REVIEW_GITHUB_REQUEST_OUTCOME=error \
                    pnpm run --silent repair:exact-review-batch request-metric || true
                fi
                cat "$github_apply_error" >&2
                rm -f "$github_apply_error"
                exit "$github_apply_status"
              fi
              lifecycle_router_outcome="durable"
            elif jq -e '.disposition.deferredCloseCoverageExpected == true' "$outcome_path" >/dev/null; then
              # Target closure remains a later proof-lane concern, while the
              # durable handoff completes this review lifecycle.
              lifecycle_router_outcome="durable"
              lifecycle_deferred_coverage="true"
            else
              lifecycle_terminal="policy_noop"
            fi
            if [ -n "$lifecycle_router_outcome" ] || [ -n "$lifecycle_terminal" ]; then
              temporary="${outcome_path}.tmp"
              jq '.postEffectsRequired = true' "$outcome_path" > "$temporary"
              mv "$temporary" "$outcome_path"
            fi
            if [ -n "$lifecycle_router_outcome" ]; then
              export LIFECYCLE_ROUTER_OUTCOME="$lifecycle_router_outcome"
              export LIFECYCLE_DEFERRED_COVERAGE="$lifecycle_deferred_coverage"
              lifecycle_payload="$(node -e '
                const crypto = require("node:crypto");
                const revision = Number(process.env.REVISION);
                if (!Number.isInteger(revision) || revision < 1 || !process.env.FENCE_KEY) process.exit(1);
                const receiptFence = crypto.createHash("sha256").update(process.env.FENCE_KEY).digest("hex").slice(0, 24);
                const prefix = process.env.LIFECYCLE_DEFERRED_COVERAGE === "true"
                  ? "router-batch-proof"
                  : process.env.LIFECYCLE_ROUTER_OUTCOME === "not_required"
                    ? "router-batch-not-required"
                    : "router-batch";
                process.stdout.write(JSON.stringify({
                  canonical_target_key: `${process.env.TARGET_REPO}#${process.env.ITEM_NUMBER}`,
                  fence_key: process.env.FENCE_KEY,
                  revision,
                  outcome: process.env.LIFECYCLE_ROUTER_OUTCOME,
                  receipt_id: `${prefix}:${process.env.GITHUB_RUN_ID}:${process.env.GITHUB_RUN_ATTEMPT}:${receiptFence}`,
                }));
              ')"
              post_effect_payload="${outcome_path}.post-effect.json"
              printf '%s' "$lifecycle_payload" > "$post_effect_payload"
              lifecycle_response="$(pnpm run --silent repair:exact-review-batch post-effect --route router-receipt --payload "$post_effect_payload")"
              jq -e '.ok == true' <<<"$lifecycle_response" >/dev/null
            elif [ -n "$lifecycle_terminal" ]; then
              export LIFECYCLE_TERMINAL="$lifecycle_terminal"
              lifecycle_payload="$(node -e '
                const crypto = require("node:crypto");
                const revision = Number(process.env.REVISION);
                if (!Number.isInteger(revision) || revision < 1 || !process.env.FENCE_KEY || !process.env.LIFECYCLE_TERMINAL) process.exit(1);
                const operationFence = crypto.createHash("sha256").update(process.env.FENCE_KEY).digest("hex").slice(0, 24);
                process.stdout.write(JSON.stringify({
                  canonical_target_key: `${process.env.TARGET_REPO}#${process.env.ITEM_NUMBER}`,
                  fence_key: process.env.FENCE_KEY,
                  revision,
                  kind: process.env.LIFECYCLE_TERMINAL,
                  operation_id: `terminal-batch:${process.env.GITHUB_RUN_ID}:${process.env.GITHUB_RUN_ATTEMPT}:${operationFence}`,
                }));
              ')"
              post_effect_payload="${outcome_path}.post-effect.json"
              printf '%s' "$lifecycle_payload" > "$post_effect_payload"
              lifecycle_response="$(pnpm run --silent repair:exact-review-batch post-effect --route terminal-disposition --payload "$post_effect_payload")"
              jq -e '.ok == true' <<<"$lifecycle_response" >/dev/null
            fi
            # The optional implementation lane consumes only a durable lifecycle
            # receipt or terminal handoff. It is deliberately independent of
            # the later terminal command acknowledgement finalizer.
            if [ "$AUTO_IMPLEMENT_ISSUES" = "1" ] &&
              [ "$remaining_implementations" -gt 0 ] &&
              [ "$target_repo" = "openclaw/openclaw" ] &&
              [ "$(jq -r '.decision.itemKind' <<<"$item")" = "issue" ] &&
              { [ "$receipt_outcome" = "accepted" ] || [ "$receipt_outcome" = "deduped" ]; } &&
              jq -e '.kind == "eligible"' "$outcome_path" >/dev/null; then
              report_path="${outcome_path%.json}.report.md"
              if [ -f "$report_path" ]; then
                if implementation_output="$(node scripts/dispatch-issue-implementation-candidates.mjs \
                  --target-repo "$target_repo" \
                  --item-number "$item_number" \
                  --artifact-dir "$(dirname "$report_path")" \
                  --max-dispatch "$remaining_implementations")"; then
                  printf '%s\n' "$implementation_output"
                  if dispatched="$(printf '%s\n' "$implementation_output" | tail -n 1 | jq -er '.dispatched')" &&
                    [[ "$dispatched" =~ ^[01]$ ]]; then
                    remaining_implementations=$((remaining_implementations - dispatched))
                  else
                    echo "::warning::Automatic issue implementation returned an invalid dispatch count; stopping batch dispatch."
                    remaining_implementations=0
                  fi
                else
                  echo "::warning::Automatic issue implementation dispatch failed; scheduled backfill will retry."
                fi
              fi
            fi
            temporary="${outcome_path}.tmp"
            jq '.postEffectsComplete = true' "$outcome_path" > "$temporary"
            mv "$temporary" "$outcome_path"
          done
          test ! -f "$heartbeat_failed"
          EXACT_REVIEW_BATCH_OBSERVATION=final_github_apply \
            pnpm run --silent repair:exact-review-batch observe || true
          pnpm run --silent repair:exact-review-batch complete

      - name: Submit batch GitHub egress telemetry
        if: ${{ always() && steps.github-egress-observer.outcome == 'success' }}
        continue-on-error: true
        env:
          CLAWSWEEPER_WEBHOOK_SECRET: ${{ secrets.CLAWSWEEPER_WEBHOOK_SECRET }}
        run: pnpm run --silent repair:github-egress-telemetry submit

      - name: Release unfinished batch members
        if: ${{ always() && steps.batch.outputs.manifest != '' }}
        continue-on-error: true
        env:
          CLAWSWEEPER_WEBHOOK_SECRET: ${{ secrets.CLAWSWEEPER_WEBHOOK_SECRET }}
        run: pnpm run --silent repair:exact-review-batch release
