name: ClawSweeper Live Proof

run-name: Live proof ${{ github.event.client_payload.repo || inputs.repo }}#${{ github.event.client_payload.item || inputs.item }}

on:
  repository_dispatch:
    types: [clawsweeper_live_proof]
  workflow_dispatch:
    inputs:
      repo:
        description: "Target repository"
        required: true
        type: string
      item:
        description: "Pull request number"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    outputs:
      produced: ${{ steps.run.outputs.produced }}
      repo: ${{ steps.target.outputs.repo }}
      item: ${{ steps.target.outputs.item }}
      repo_owner: ${{ steps.target.outputs.repo_owner }}
      repo_name: ${{ steps.target.outputs.repo_name }}
      repo_slug: ${{ steps.target.outputs.repo_slug }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Resolve target and decision artifact
        id: target
        env:
          EVENT_REPO: ${{ github.event.client_payload.repo || inputs.repo }}
          EVENT_ITEM: ${{ github.event.client_payload.item || inputs.item }}
          LIVE_PROOF_PLAN_JSON: ${{ toJSON(github.event.client_payload.live_proof_plan) }}
        run: |
          set -euo pipefail
          repo="$(printf '%s' "$EVENT_REPO" | tr '[:upper:]' '[:lower:]')"
          item="$EVENT_ITEM"
          if ! [[ "$repo" =~ ^[a-z0-9_.-]+/[a-z0-9_.-]+$ ]] || ! [[ "$item" =~ ^[1-9][0-9]*$ ]]; then
            echo "Invalid live-proof target: $repo#$item" >&2
            exit 1
          fi
          repo_owner="$(cut -d/ -f1 <<<"$repo")"
          repo_name="$(cut -d/ -f2 <<<"$repo")"
          repo_slug="$(tr / - <<<"$repo")"
          if [ -n "$LIVE_PROOF_PLAN_JSON" ] && [ "$LIVE_PROOF_PLAN_JSON" != "null" ]; then
            printf '%s\n' "$LIVE_PROOF_PLAN_JSON" | jq -e . > /tmp/live-proof-plan.json
          else
            printf '%s\n' '{"status":"not_applicable","surface":"none","reason":"Manual dispatch did not include a publication plan.","entry":"","steps":[]}' > /tmp/live-proof-plan.json
            echo "::notice::No publication plan was supplied; the execution gate will complete as a safe skip."
          fi
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const plan = JSON.parse(readFileSync("/tmp/live-proof-plan.json", "utf8"));
          const steps = Array.isArray(plan.steps)
            ? plan.steps.map((step) => "- " + JSON.stringify(step)).join("\n")
            : "";
          const report = [
            "## Live Proof",
            "",
            "Status: " + String(plan.status || ""),
            "",
            "Surface: " + String(plan.surface || ""),
            "",
            "Reason: " + String(plan.reason || ""),
            "",
            "Entry: " + String(plan.entry || ""),
            "",
            "Steps:",
            "",
            steps,
            "",
          ].join("\n");
          writeFileSync("live-proof-report.md", report, "utf8");
          NODE
          {
            echo "repo=$repo"
            echo "item=$item"
            echo "repo_owner=$repo_owner"
            echo "repo_name=$repo_name"
            echo "repo_slug=$repo_slug"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-pnpm
        with:
          build-script: build

      - name: Install deterministic recording tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg tmux xvfb xterm

      - name: Check out the public PR head
        env:
          TARGET_REPO: ${{ steps.target.outputs.repo }}
          ITEM_NUMBER: ${{ steps.target.outputs.item }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            "https://api.github.com/repos/$TARGET_REPO/pulls/$ITEM_NUMBER" > /tmp/live-proof-pr.json
          head_sha="$(jq -r '.head.sha // empty' /tmp/live-proof-pr.json)"
          clone_url="$(jq -r '.head.repo.clone_url // empty' /tmp/live-proof-pr.json)"
          if ! [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || [ -z "$clone_url" ]; then
            echo "Unable to resolve the public PR head." >&2
            exit 1
          fi
          git clone --filter=blob:none --no-checkout "$clone_url" target-pr
          git -C target-pr fetch --depth=1 origin "$head_sha"
          git -C target-pr checkout --detach "$head_sha"

      - name: Execute secretless live proof
        id: run
        working-directory: target-pr
        env:
          CLAWSWEEPER_LIVE_PROOF_ENABLED: ${{ vars.CLAWSWEEPER_LIVE_PROOF_ENABLED }}
        run: |
          set -euo pipefail
          setsid timeout --kill-after=30s 1500s node ../dist/clawsweeper.js live-proof \
            --repo "${{ steps.target.outputs.repo }}" \
            --item "${{ steps.target.outputs.item }}" \
            --record ../live-proof-report.md \
            --output ../live-proof-bundle
          if [ -f ../live-proof-bundle/live-proof-manifest.json ]; then
            echo "produced=true" >> "$GITHUB_OUTPUT"
          else
            echo "produced=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v7
        if: ${{ steps.run.outputs.produced == 'true' }}
        with:
          name: live-proof-${{ steps.target.outputs.repo_slug }}-${{ steps.target.outputs.item }}
          path: live-proof-bundle
          if-no-files-found: error
          retention-days: 7

  attach:
    needs: execute
    if: ${{ needs.execute.outputs.produced == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Create target write token
        id: target-write-token
        uses: ./.github/actions/create-target-write-token
        with:
          client-id: ${{ env.CLAWSWEEPER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: ${{ needs.execute.outputs.repo_owner }}
          repository: ${{ needs.execute.outputs.repo_name }}

      - uses: ./.github/actions/setup-state
        with:
          coordinator-url: ${{ vars.CLAWSWEEPER_EXACT_REVIEW_QUEUE_URL || 'https://clawsweeper.openclaw.ai' }}
          records-url: ${{ vars.CLAWSWEEPER_EXACT_REVIEW_QUEUE_URL || 'https://clawsweeper.openclaw.ai' }}
          records-secret: ${{ secrets.CLAWSWEEPER_WEBHOOK_SECRET }}
          records-repo-slugs: ${{ needs.execute.outputs.repo_slug }}
          records-item-number: ${{ needs.execute.outputs.item }}
          hydrate-git-state: "false"
          hydrate-state-blobs: "false"

      - uses: ./.github/actions/setup-pnpm
        with:
          build-script: build:all

      - name: Install media validators
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - uses: actions/download-artifact@v8
        with:
          name: live-proof-${{ needs.execute.outputs.repo_slug }}-${{ needs.execute.outputs.item }}
          path: live-proof-bundle

      - name: Validate, upload, and attach live proof
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CLAWSWEEPER_LIVE_PROOF_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CLAWSWEEPER_LIVE_PROOF_AWS_SECRET_ACCESS_KEY }}
          CLAWSWEEPER_LIVE_PROOF_S3_ENDPOINT: ${{ secrets.CLAWSWEEPER_LIVE_PROOF_S3_ENDPOINT }}
          CLAWSWEEPER_LIVE_PROOF_BUCKET: ${{ secrets.CLAWSWEEPER_LIVE_PROOF_BUCKET }}
          CLAWSWEEPER_LIVE_PROOF_BASE_URL: ${{ secrets.CLAWSWEEPER_LIVE_PROOF_BASE_URL }}
          CLAWSWEEPER_WEBHOOK_SECRET: ${{ secrets.CLAWSWEEPER_WEBHOOK_SECRET }}
          GH_TOKEN: ${{ steps.target-write-token.outputs.token }}
          QUEUE_URL: ${{ vars.CLAWSWEEPER_EXACT_REVIEW_QUEUE_URL || 'https://clawsweeper.openclaw.ai' }}
        run: |
          set -euo pipefail
          record="records/${{ needs.execute.outputs.repo_slug }}/items/${{ needs.execute.outputs.item }}.md"
          node dist/clawsweeper.js live-proof-attach \
            --bundle live-proof-bundle \
            --record "$record"
          pnpm run repair:publish-main -- \
            --message "chore: attach live proof" \
            --path "$record" \
            --rebase-strategy normal
