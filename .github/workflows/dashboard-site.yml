name: Dashboard site

# Static operator dashboard (dashboard-site/), rebuilt every 15 minutes and published to
# Cloudflare Pages. The clawsweeper.openclaw.ai Worker serves its pages from there; webhooks,
# the queue and /api/* stay on the Worker and are never redeployed by this workflow.
# Review totals, quality and closes come from the corpus aggregate, refreshed twice a day in the
# quietest review hours (00:00 and 12:00 UTC) and on request.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      refresh_corpus:
        description: >-
          Re-read every canonical record (heavy: the export runs inside the exact-review queue
          Durable Object and slows reviews while it runs). Use at a quiet hour.
        type: boolean
        default: false
      backfill_days:
        description: >-
          Fill sweep counts and sampled run durations for this many past days (up to 30), about
          20 requests per day with this repository's token. 0 keeps the normal incremental refresh.
        type: number
        default: 0
  # Branches have no cached corpus (caches flow from main only), so only main publishes.
  push:
    branches: [main]
    paths:
      - "dashboard-site/**"
      - ".github/workflows/dashboard-site.yml"
  # Pull requests only build the site from a committed fixture snapshot; no secrets, no publish.
  pull_request:
    paths:
      - "dashboard-site/**"
      - ".github/workflows/dashboard-site.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: dashboard-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-check:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm
        with:
          working-directory: dashboard-site

      - name: Build the site from the fixture snapshot
        working-directory: dashboard-site
        run: |
          set -euo pipefail
          mkdir -p src/data
          cp fixtures/dashboard.json src/data/dashboard.json
          pnpm run build
          for page in index.html agent/index.html operations/index.html queue/index.html throughput/index.html quality/index.html coverage/index.html repos/index.html 404.html; do
            test -s "dist/$page" || { echo "::error::missing dist/$page"; exit 1; }
          done

  publish:
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLAWSWEEPER_APP_CLIENT_ID: Iv23liOECG0slfuhz093
      CLOUDFLARE_ACCOUNT_ID: 91b59577e757131d68d55a471fe32aca
      PAGES_PROJECT: clawsweeper-dashboard
    steps:
      - uses: actions/checkout@v7
        with:
          filter: blob:none
          persist-credentials: false

      - uses: ./.github/actions/setup-pnpm
        with:
          working-directory: dashboard-site

      # State between runs: Actions history (per-hour buckets), repository visibility and the
      # last corpus aggregate. Cache keys are immutable, so the key includes the attempt: a
      # rerun must save its own state, not lose it to the failed attempt's key.
      - name: Restore dashboard state
        id: state
        uses: actions/cache/restore@v6
        with:
          path: .dashboard-state
          key: dashboard-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dashboard-state-

      # GitHub delays and drops scheduled runs, so the refresh follows the corpus age, not one
      # cron line: any scheduled run in the 00 or 12 UTC hour refreshes a corpus over 11 hours
      # old, and a corpus over 13 hours old refreshes at once (the dashboard warns at 14 hours).
      # A missing corpus waits for a manual refresh_corpus run at a quiet hour.
      - name: Decide corpus refresh
        id: refresh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED: ${{ inputs.refresh_corpus == true }}
        run: |
          set -euo pipefail
          refresh=false
          if [ "$REQUESTED" = "true" ]; then
            refresh=true
          elif [ "$EVENT_NAME" = "schedule" ] && [ -f .dashboard-state/corpus.json ]; then
            built="$(jq -r '.generatedAt' .dashboard-state/corpus.json)"
            age_hours=$(( ($(date -u +%s) - $(date -u -d "$built" +%s)) / 3600 ))
            hour="$(date -u +%H)"
            if [ "$age_hours" -ge 13 ] || { [ "$age_hours" -ge 11 ] && { [ "$hour" = "00" ] || [ "$hour" = "12" ]; }; }; then
              refresh=true
            fi
            echo "Corpus built $built (${age_hours}h old); refresh=$refresh"
          fi
          echo "corpus=$refresh" >> "$GITHUB_OUTPUT"

      # Twice a day and on request: a full record export loads the production queue Durable Object.
      - name: Hydrate canonical records read-only
        if: ${{ steps.refresh.outputs.corpus == 'true' }}
        env:
          CLAWSWEEPER_RECORDS_URL: ${{ vars.CLAWSWEEPER_EXACT_REVIEW_QUEUE_URL || 'https://clawsweeper.openclaw.ai' }}
          CLAWSWEEPER_RECORDS_SECRET: ${{ secrets.CLAWSWEEPER_WEBHOOK_SECRET }}
        run: node scripts/hydrate-state.ts --skip-git-state --skip-state-blobs

      # Until the first refresh_corpus run there is nothing to show: skip quietly, do not fail.
      - name: Check corpus
        id: corpus
        env:
          REFRESH_CORPUS: ${{ steps.refresh.outputs.corpus }}
        run: |
          if [ "$REFRESH_CORPUS" = "true" ] || [ -f .dashboard-state/corpus.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No cached corpus yet; run this workflow once with refresh_corpus at a quiet hour."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # Only a missing history needs the app's higher rate limit, for the 2-day bootstrap.
      - name: Create bootstrap token
        id: bootstrap
        if: ${{ steps.corpus.outputs.ready == 'true' && steps.state.outputs.cache-matched-key == '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.CLAWSWEEPER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: openclaw
          repositories: clawsweeper
          permission-actions: read

      - name: Build dashboard data
        if: ${{ steps.corpus.outputs.ready == 'true' }}
        working-directory: dashboard-site
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOOTSTRAP_GITHUB_TOKEN: ${{ steps.bootstrap.outputs.token }}
          RECORDS_ARGS: ${{ steps.refresh.outputs.corpus == 'true' && '--records ../records' || '' }}
          BACKFILL_DAYS: ${{ inputs.backfill_days || 0 }}
        run: |
          read -r -a records_args <<< "$RECORDS_ARGS"
          node scripts/build-data.ts --state ../.dashboard-state "${records_args[@]}" --backfill-days "$BACKFILL_DAYS"

      - name: Save dashboard state
        if: ${{ always() && hashFiles('.dashboard-state/actions.json') != '' }}
        uses: actions/cache/save@v6
        with:
          path: .dashboard-state
          key: dashboard-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build site
        if: ${{ steps.corpus.outputs.ready == 'true' }}
        working-directory: dashboard-site
        run: pnpm run build

      - name: Publish to Cloudflare Pages
        if: ${{ steps.corpus.outputs.ready == 'true' }}
        working-directory: dashboard-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.OPENCLAW_CLOUDFLARE_PAGES_API_TOKEN }}
        run: |
          set -euo pipefail
          if ! npx --yes wrangler@4.131.1 pages project list | grep -qw "$PAGES_PROJECT"; then
            npx --yes wrangler@4.131.1 pages project create "$PAGES_PROJECT" --production-branch main
          fi
          npx --yes wrangler@4.131.1 pages deploy dist --project-name "$PAGES_PROJECT" --branch "$GITHUB_REF_NAME" --commit-dirty=true
