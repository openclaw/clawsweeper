name: repair cluster intake

on:
  workflow_dispatch:
    inputs:
      enabled:
        description: "Run cluster repair intake"
        required: false
        default: "1"
        type: string
      target_repo:
        description: "Target repository"
        required: true
        default: "openclaw/openclaw"
        type: string
      limit:
        description: "Number of unprocessed clusters offered to the selector model"
        required: false
        default: "8"
        type: string
      runner:
        description: "Runner label for repair planning/review work"
        required: false
        default: blacksmith-4vcpu-ubuntu-2404
        type: string
      execution_runner:
        description: "Runner label for fix/apply execution work"
        required: false
        default: blacksmith-16vcpu-ubuntu-2404
        type: string
      model:
        description: "Internal Codex model alias"
        required: false
        default: internal
        type: string
      force_store:
        description: "Ignore the processed-store ledger and retry the current gitcrawl-store snapshot"
        required: false
        default: false
        type: boolean
  schedule:
    # gitcrawl-store refreshes openclaw/openclaw every 15 minutes. This intake
    # runs daily and records the processed portable DB SHA so a
    # delayed or duplicate tick does not enqueue work from the same store twice.
    - cron: "8 8 * * *"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CLAWSWEEPER_APP_CLIENT_ID: Iv23liOECG0slfuhz093
  CLAWSWEEPER_ALLOWED_OWNER: ${{ vars.CLAWSWEEPER_ALLOWED_OWNER || 'openclaw' }}
  CLAWSWEEPER_MODEL: internal
  CLAWSWEEPER_GIT_USER_NAME: ${{ vars.CLAWSWEEPER_GIT_USER_NAME || 'clawsweeper[bot]' }}
  CLAWSWEEPER_GIT_USER_EMAIL: ${{ vars.CLAWSWEEPER_GIT_USER_EMAIL || '274271284+clawsweeper[bot]@users.noreply.github.com' }}

concurrency:
  group: cluster-repair-intake-${{ github.event.inputs.target_repo || vars.CLAWSWEEPER_CLUSTER_REPAIR_TARGET_REPO || 'openclaw/openclaw' }}
  cancel-in-progress: false

jobs:
  intake:
    if: ${{ github.event_name != 'schedule' || vars.CLAWSWEEPER_FEATURE_CLUSTER_REPAIR_ENABLED == '1' }}
    runs-on: ${{ github.event.inputs.runner || vars.CLAWSWEEPER_CLUSTER_REPAIR_INTAKE_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 45
    steps:
      - name: Create central GitHub App token
        id: central-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.CLAWSWEEPER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: openclaw
          repositories: clawsweeper
          permission-actions: write
          permission-contents: read

      - name: Create gitcrawl-store token
        id: store-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.CLAWSWEEPER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: openclaw
          repositories: gitcrawl-store
          permission-contents: read

      - name: Resolve target repository
        id: target
        env:
          TARGET_REPO: ${{ github.event.inputs.target_repo || vars.CLAWSWEEPER_CLUSTER_REPAIR_TARGET_REPO || 'openclaw/openclaw' }}
          ALLOWED_OWNER: ${{ vars.CLAWSWEEPER_ALLOWED_OWNER || 'openclaw' }}
        run: |
          set -euo pipefail
          # CLAWSWEEPER_ALLOWED_OWNER is a comma- or whitespace-separated owner
          # list (issue #604; allowedRepairOwners in src/repair/lib.ts).
          owners_normalized="$(printf '%s' "$ALLOWED_OWNER" | tr ',' ' ' | tr -s '[:space:]' ' ')"
          read -r -a allowed_owners <<< "$owners_normalized"
          if [ "${#allowed_owners[@]}" -eq 0 ]; then
            echo "Invalid allowed repository owner" >&2
            exit 2
          fi
          for allowed_owner in "${allowed_owners[@]}"; do
            if ! printf '%s' "$allowed_owner" | grep -Eq '^[A-Za-z0-9_.-]+$'; then
              echo "Invalid allowed repository owner" >&2
              exit 2
            fi
          done
          if ! printf '%s' "$TARGET_REPO" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
            echo "Invalid target repository" >&2
            exit 2
          fi
          target_owner="${TARGET_REPO%%/*}"
          target_name="${TARGET_REPO#*/}"
          target_owner_lower="$(printf '%s' "$target_owner" | tr '[:upper:]' '[:lower:]')"
          target_slug="$(printf '%s' "$TARGET_REPO" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9_.-]+/-/g')"
          owner_allowed=0
          for allowed_owner in "${allowed_owners[@]}"; do
            if [ "$target_owner_lower" = "$(printf '%s' "$allowed_owner" | tr '[:upper:]' '[:lower:]')" ]; then
              owner_allowed=1
              break
            fi
          done
          if [ "$owner_allowed" != "1" ]; then
            echo "Target repository must be owned by one of: ${ALLOWED_OWNER}" >&2
            exit 2
          fi
          {
            printf 'owner=%s\n' "$target_owner"
            printf 'name=%s\n' "$target_name"
            printf 'full_name=%s/%s\n' "$target_owner" "$target_name"
            printf 'slug=%s\n' "$target_slug"
          } >> "$GITHUB_OUTPUT"

      - name: Create target read token
        id: target-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ env.CLAWSWEEPER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          permission-issues: read
          permission-pull-requests: read

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.central-token.outputs.token }}
          filter: blob:none
          fetch-depth: 0

      - uses: ./.github/actions/setup-pnpm
        with:
          build-script: build:repair

      # Cluster jobs/results remain git-backed until their own migration. This
      # lane owns their narrow publication and dispatch recovery directly.
      - name: Create state token
        id: state-token
        uses: ./.github/actions/create-state-token
        with:
          client-id: ${{ env.CLAWSWEEPER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}

      - uses: ./.github/actions/setup-state
        with:
          coordinator-url: ${{ vars.CLAWSWEEPER_EXACT_REVIEW_QUEUE_URL || 'https://clawsweeper.openclaw.ai' }}
          records-url: ${{ vars.CLAWSWEEPER_EXACT_REVIEW_QUEUE_URL || 'https://clawsweeper.openclaw.ai' }}
          records-secret: ${{ secrets.CLAWSWEEPER_WEBHOOK_SECRET }}
          records-repo-slugs: ${{ steps.target.outputs.slug }}
          # Intake reads jobs and results only; ledger/assets hydration is unrelated and unbounded.
          hydrate-state-blobs: "false"
          token: ${{ steps.state-token.outputs.token }}
          fetch-depth: 1
          persist-credentials: "true"

      - name: Recover pending cluster dispatches
        env:
          GH_TOKEN: ${{ steps.central-token.outputs.token }}
          CLAWSWEEPER_STATE_COORDINATOR_SECRET: ${{ secrets.CLAWSWEEPER_WEBHOOK_SECRET }}
          CLAWSWEEPER_WEBHOOK_SECRET: ${{ secrets.CLAWSWEEPER_WEBHOOK_SECRET }}
          CLAWSWEEPER_REPO: openclaw/clawsweeper
          CLAWSWEEPER_DISPATCH_REF: ${{ github.ref_name }}
          CLAWSWEEPER_WORKER_RUNNER: ${{ vars.CLAWSWEEPER_WORKER_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
          CLAWSWEEPER_EXECUTION_RUNNER: ${{ vars.CLAWSWEEPER_EXECUTION_RUNNER || 'blacksmith-16vcpu-ubuntu-2404' }}
        run: pnpm run repair:publish-cluster-intake -- --recover

      - uses: actions/checkout@v7
        with:
          repository: openclaw/gitcrawl-store
          token: ${{ steps.store-token.outputs.token }}
          path: gitcrawl-store
          fetch-depth: 1

      - name: Prepare intake
        id: prepare
        env:
          ENABLED: ${{ github.event.inputs.enabled || '1' }}
          SCHEDULE_ENABLED: ${{ vars.CLAWSWEEPER_FEATURE_CLUSTER_REPAIR_ENABLED == '1' && '1' || '0' }}
          TARGET_REPO: ${{ steps.target.outputs.full_name }}
          FORCE_STORE: ${{ github.event.inputs.force_store == 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          if [ "$ENABLED" != "1" ]; then
            echo "should_import=false" >> "$GITHUB_OUTPUT"
            echo "Cluster repair intake is disabled for this manual dispatch."
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] && [ "$SCHEDULE_ENABLED" != "1" ]; then
            echo "should_import=false" >> "$GITHUB_OUTPUT"
            echo "Scheduled cluster repair intake is disabled. Set CLAWSWEEPER_FEATURE_CLUSTER_REPAIR_ENABLED=1."
            exit 0
          fi

          repo_slug="${TARGET_REPO//\//-}"
          db_name="${TARGET_REPO,,}"
          db_name="${db_name//\//__}.sync.db"
          manifest_path="gitcrawl-store/data/${db_name}.manifest.json"
          ledger_path="results/cluster-repair-intake/${repo_slug}.json"
          if [ ! -f "$manifest_path" ]; then
            echo "::error::Missing gitcrawl-store manifest: ${manifest_path}"
            exit 1
          fi
          store_sha="$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); console.log(m.sha256 || '')" "$manifest_path")"
          exported_at="$(node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); console.log(m.exportedAt || '')" "$manifest_path")"
          previous_sha=""
          if [ -f "$ledger_path" ]; then
            previous_sha="$(node -e "const fs=require('fs'); const p=process.argv[1]; const r=JSON.parse(fs.readFileSync(p, 'utf8')); console.log(r.last_processed_store_sha256 || '')" "$ledger_path")"
          fi

          {
            echo "target_repo=${TARGET_REPO}"
            echo "repo_slug=${repo_slug}"
            echo "manifest_path=${manifest_path}"
            echo "ledger_path=${ledger_path}"
            echo "store_sha=${store_sha}"
            echo "exported_at=${exported_at}"
          } >> "$GITHUB_OUTPUT"

          if [ "$FORCE_STORE" != "1" ] && [ -n "$store_sha" ] && [ "$store_sha" = "$previous_sha" ]; then
            echo "should_import=false" >> "$GITHUB_OUTPUT"
            echo "Already processed gitcrawl-store SHA ${store_sha}; skipping intake."
            exit 0
          fi
          intake_dir="$(mktemp -d "${RUNNER_TEMP}/cluster-repair-intake.XXXXXX")"
          db_path="${intake_dir}/${db_name}"
          materializer="${intake_dir}/portable-artifact.mjs"
          # Snapshot publishing must not authorize new code on the runner.
          install -m 600 gitcrawl-store/scripts/portable-artifact.mjs "$materializer"
          if ! printf '%s  %s\n' 'd3e7678faa48554e091ea51666692643e97cfab437bb23c44f59c139b7e0ebfa' "$materializer" | sha256sum --check --status; then
            echo "::error::gitcrawl-store materializer does not match the reviewed digest" >&2
            exit 1
          fi
          (
            cd gitcrawl-store
            node "$materializer" "data/${db_name}" "$db_path"
          )
          {
            echo "db_path=${db_path}"
            echo "should_import=true"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare unprocessed cluster candidates
        if: ${{ steps.prepare.outputs.should_import == 'true' }}
        env:
          TARGET_REPO: ${{ steps.prepare.outputs.target_repo }}
          DB_PATH: ${{ steps.prepare.outputs.db_path }}
          LIMIT: ${{ github.event.inputs.limit || vars.CLAWSWEEPER_CLUSTER_REPAIR_CANDIDATE_BATCH || '8' }}
        run: |
          set -euo pipefail
          mkdir -p .artifacts/cluster-repair-intake
          generated_log=".artifacts/cluster-repair-intake/generated.txt"
          pnpm run repair:import-gitcrawl -- \
            --from-gitcrawl \
            --repo "$TARGET_REPO" \
            --db "$DB_PATH" \
            --allow-empty \
            --limit "$LIMIT" \
            --mode autonomous \
            --allow-fix-pr true \
            --allow-merge false \
            --allow-instant-close false \
            --allow-post-merge-close true \
            2> >(tee .artifacts/cluster-repair-intake/import-stderr.txt >&2) \
            | tee "$generated_log"

          mapfile -t generated < <(grep '^jobs/' "$generated_log" || true)
          printf '%s\n' "${generated[@]}" > .artifacts/cluster-repair-intake/generated-paths.txt

      - name: Select one useful cluster or none
        if: ${{ steps.prepare.outputs.should_import == 'true' }}
        env:
          TARGET_REPO: ${{ steps.prepare.outputs.target_repo }}
          GH_TOKEN: ${{ steps.target-token.outputs.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAWSWEEPER_INTERNAL_MODEL: ${{ secrets.CLAWSWEEPER_MODEL }}
          MODEL: ${{ github.event.inputs.model || 'internal' }}
        run: |
          set -euo pipefail
          candidates_file=".artifacts/cluster-repair-intake/generated-paths.txt"
          selected_file=".artifacts/cluster-repair-intake/selected-paths.txt"
          pnpm run repair:select-cluster-candidate -- \
            --repo "$TARGET_REPO" \
            --paths-file "$candidates_file" \
            --out "$selected_file" \
            --report .artifacts/cluster-repair-intake/selection-report.json \
            --model "$MODEL"

          while IFS= read -r candidate; do
            [ -n "$candidate" ] || continue
            if ! grep -Fqx -- "$candidate" "$selected_file"; then
              rm -f -- "$candidate"
            fi
          done < "$candidates_file"
          mv "$selected_file" "$candidates_file"

      - name: Build durable intake intent
        if: ${{ steps.prepare.outputs.should_import == 'true' }}
        env:
          TARGET_REPO: ${{ steps.prepare.outputs.target_repo }}
          STORE_SHA: ${{ steps.prepare.outputs.store_sha }}
          EXPORTED_AT: ${{ steps.prepare.outputs.exported_at }}
          MANIFEST_PATH: ${{ steps.prepare.outputs.manifest_path }}
          WORKER_RUNNER: ${{ github.event.inputs.runner || vars.CLAWSWEEPER_WORKER_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
          EXECUTION_RUNNER: ${{ github.event.inputs.execution_runner || vars.CLAWSWEEPER_EXECUTION_RUNNER || 'blacksmith-16vcpu-ubuntu-2404' }}
          MODEL: internal
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto = require("crypto");
          const fs = require("fs");
          const generatedPath = ".artifacts/cluster-repair-intake/generated-paths.txt";
          const selectionPath = ".artifacts/cluster-repair-intake/selection-report.json";
          const generated = (fs.existsSync(generatedPath) ? fs.readFileSync(generatedPath, "utf8") : "")
            .split(/\r?\n/)
            .map((line) => line.trim())
            .filter(Boolean);
          const selection = fs.existsSync(selectionPath)
            ? JSON.parse(fs.readFileSync(selectionPath, "utf8"))
            : { evaluated: 0, rejected: 0, selected: 0, reason_counts: {}, decision: null, assessments: [] };
          const repoSlug = process.env.TARGET_REPO.replace("/", "-");
          const jobs = generated.map((jobPath) => {
            const match = /\/gitcrawl-(\d+)-/.exec(jobPath);
            if (!match) throw new Error(`Generated job omitted gitcrawl cluster ID: ${jobPath}`);
            const content = fs.readFileSync(jobPath, "utf8");
            const clusterId = Number(match[1]);
            return {
              cluster_id: clusterId,
              path: jobPath,
              content,
              digest: crypto.createHash("sha256").update(content).digest("hex"),
              dispatch_key: `cluster-intake:${repoSlug}:${clusterId}`,
            };
          });
          const intent = {
            schema: "clawsweeper-cluster-intake-intent-v1",
            target_repo: process.env.TARGET_REPO,
            repo_slug: repoSlug,
            store_sha256: process.env.STORE_SHA,
            store_exported_at: process.env.EXPORTED_AT,
            manifest_path: process.env.MANIFEST_PATH,
            run_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            accepted_at: new Date().toISOString(),
            runner: process.env.WORKER_RUNNER,
            execution_runner: process.env.EXECUTION_RUNNER,
            model: process.env.MODEL,
            selector_summary: {
              evaluated: Number(selection.evaluated || 0),
              rejected: Number(selection.rejected || 0),
              reason_counts: selection.reason_counts || {},
            },
            selector_decision: selection.decision === null ? null : {
              rationale: selection.decision,
              assessments: selection.assessments,
            },
            jobs,
          };
          fs.writeFileSync(".artifacts/cluster-repair-intake/intent.json", `${JSON.stringify(intent, null, 2)}\n`);
          NODE

      - name: Durably accept cluster intake
        if: ${{ steps.prepare.outputs.should_import == 'true' }}
        env:
          GH_TOKEN: ${{ steps.central-token.outputs.token }}
          CLAWSWEEPER_STATE_COORDINATOR_SECRET: ${{ secrets.CLAWSWEEPER_WEBHOOK_SECRET }}
          CLAWSWEEPER_WEBHOOK_SECRET: ${{ secrets.CLAWSWEEPER_WEBHOOK_SECRET }}
          CLAWSWEEPER_REPO: openclaw/clawsweeper
          CLAWSWEEPER_DISPATCH_REF: ${{ github.ref_name }}
          CLAWSWEEPER_WORKER_RUNNER: ${{ vars.CLAWSWEEPER_WORKER_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
          CLAWSWEEPER_EXECUTION_RUNNER: ${{ vars.CLAWSWEEPER_EXECUTION_RUNNER || 'blacksmith-16vcpu-ubuntu-2404' }}
        run: |
          set -euo pipefail
          pnpm run repair:publish-cluster-intake -- .artifacts/cluster-repair-intake/intent.json
