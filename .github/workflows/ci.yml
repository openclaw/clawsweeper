name: Shard concurrency experiment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shard-concurrency-experiment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  experiment:
    if: github.repository == 'openclaw/clawsweeper'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out experiment control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: control
          sparse-checkout: |
            .github/workflows/ci.yml
            scripts/profile-test-concurrency.py
          sparse-checkout-cone-mode: false

      - name: Stage disposable driver outside the workload
        run: cp control/scripts/profile-test-concurrency.py "$RUNNER_TEMP/shard-concurrency-driver.py"

      - name: Check out unchanged workload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: e312d173d51876ee8e061d55e81d8cd9650edcaf
          persist-credentials: false
          path: workload

      - uses: ./workload/.github/actions/setup-pnpm
        with:
          working-directory: workload
          build-script: build:all

      - name: Compare the unchanged critical shard on one host
        env:
          EXPERIMENT_WORKLOAD: ${{ github.workspace }}/workload
          EXPERIMENT_OUTPUT: ${{ runner.temp }}/shard-concurrency-experiment
        run: python3 "$RUNNER_TEMP/shard-concurrency-driver.py" "$EXPERIMENT_WORKLOAD" "$EXPERIMENT_OUTPUT"

      - name: Retain bounded experiment receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: shard-concurrency-experiment-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/shard-concurrency-experiment/*.json
            ${{ runner.temp }}/shard-concurrency-experiment/*/*.json
            ${{ runner.temp }}/shard-concurrency-experiment/*/*.xml
            ${{ runner.temp }}/shard-concurrency-experiment/*/*.log
          if-no-files-found: error
          retention-days: 1
