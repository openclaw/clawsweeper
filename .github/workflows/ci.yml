name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "apply-report.json"
      - "repair-apply-report.json"
      - "jobs/**"
      - "records/**"
      - "results/**"
  pull_request:
  workflow_dispatch:
    inputs:
      codex_auth_mode:
        description: "Inference route for the hosted canary; configured uses the repository setting"
        type: choice
        default: configured
        options:
          - configured
          - clawrouter

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review-network-smoke:
    name: review-network-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install pinned Codex and prove Linux review sandbox
        shell: bash
        run: |
          set -euo pipefail
          codex_version="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const action = readFileSync(".github/actions/setup-codex/action.yml", "utf8");
            const version = action.match(/^  codex-version:\n(?:    [^\n]*\n)*?    default: "(\d+\.\d+\.\d+)"$/m)?.[1];
            if (!version) throw new Error("Missing exact setup-codex version pin");
            process.stdout.write(version);
          ')"
          codex_prefix="$(mktemp -d "$RUNNER_TEMP/review-codex.XXXXXX")"
          npm install --global --prefix "$codex_prefix" "@openai/codex@$codex_version" \
            --no-audit --no-fund --ignore-scripts
          export PATH="$codex_prefix/bin:$PATH"

          # Match setup-codex's hosted Linux bubblewrap prerequisites.
          current_userns="$(sysctl -n kernel.unprivileged_userns_clone 2>/dev/null || true)"
          if [[ -n "$current_userns" && "$current_userns" != "1" ]]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          current_apparmor="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)"
          if [[ -n "$current_apparmor" && "$current_apparmor" != "0" ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

          CODEX_HOME="$(mktemp -d "$RUNNER_TEMP/review-codex-home.XXXXXX")"
          export CODEX_HOME
          printf 'model = "gpt-5.4"\n' > "$CODEX_HOME/config.toml"
          export GITHUB_WORKSPACE="$PWD"
          node .github/actions/setup-codex/configure-review-network.mjs
          bash .github/actions/setup-codex/smoke-review-network.sh

  hosted-review-scan:
    name: Hosted native review scan smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
        with:
          build-script: build
      - uses: ./.github/actions/setup-codex
        env:
          OPENAI_API_KEY: ${{ inputs.codex_auth_mode != 'clawrouter' && vars.CLAWSWEEPER_CODEX_AUTH_MODE != 'clawrouter' && secrets.OPENAI_API_KEY || '' }}
          CLAWSWEEPER_INTERNAL_MODEL: ${{ inputs.codex_auth_mode != 'clawrouter' && vars.CLAWSWEEPER_CODEX_AUTH_MODE != 'clawrouter' && secrets.CLAWSWEEPER_MODEL || '' }}
          CLAWSWEEPER_CLAWROUTER_CONFIG: ${{ secrets.CLAWSWEEPER_CLAWROUTER_CONFIG }}
        with:
          auth-mode: ${{ inputs.codex_auth_mode == 'clawrouter' && 'clawrouter' || vars.CLAWSWEEPER_CODEX_AUTH_MODE || 'proxy' }}
      - name: Prove refusal then clean structured review
        run: node scripts/hosted-review-scan-smoke.mjs "$RUNNER_TEMP/hosted-review-scan-proof.json"
      - uses: actions/upload-artifact@v7
        with:
          name: hosted-review-scan-proof
          path: ${{ runner.temp }}/hosted-review-scan-proof.json
          if-no-files-found: error

  check:
    name: pnpm check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Validate workflow semantics
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_LINUX_AMD64_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          actionlint_archive="${RUNNER_TEMP}/actionlint.tar.gz"
          curl --fail --show-error --silent --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$actionlint_archive"
          printf '%s  %s\n' "$ACTIONLINT_LINUX_AMD64_SHA256" "$actionlint_archive" | sha256sum --check -
          tar -xzf "$actionlint_archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" \
            -shellcheck= \
            -ignore 'unexpected key "queue" for "concurrency" section' \
            .github/workflows/*.yml

      - uses: ./.github/actions/setup-pnpm

      - name: Run check
        run: pnpm run check

  sparse-repair-builds:
    name: sparse repair build smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pnpm

      - name: Build each sparse repair checkout
        run: pnpm run test:workflow-sparse-checkout

  windows-codex-launch:
    name: Windows Codex launcher
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pnpm

      - name: Build process workers
        run: |
          pnpm run build
          pnpm run build:repair

      - name: Verify native Windows launcher
        run: >
          node --test --test-name-pattern
          "escaped Windows launchers|extensionless Windows node shebang shims|CODEX_BIN and preserves argv|timeout errors|app-server mode"
          test/codex-process.test.ts
