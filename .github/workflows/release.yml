name: Local package release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already recorded in dated release notes and package metadata
        required: true
        type: string
      publish:
        description: Publish from an existing signed version tag; otherwise rehearse
        type: boolean
        default: false

permissions: {}

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require the version tag for publication
        env:
          PUBLISH: ${{ inputs.publish }}
          VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          node <<'NODE'
          if (process.env.PUBLISH === "true") {
            const version = process.env.VERSION.replace(/^v/, "");
            if (process.env.RELEASE_REF !== `refs/tags/v${version}`) {
              console.error("Publication requires the existing signed version tag ref.");
              process.exit(1);
            }
          }
          NODE

  qualification:
    needs: preflight
    uses: ./.github/workflows/local-package-qualification.yml
    permissions:
      contents: read

  release:
    needs: qualification
    # The pinned callee declares write access for its tag/publish jobs, even
    # though the default dry run performs no writes through those paths.
    permissions:
      actions: read
      checks: read
      contents: write
      statuses: read
    uses: openclaw/release-workflows/.github/workflows/release-source.yml@933d6886e83ec26f29f13b3444638f0d7fd9cde3
    with:
      version: ${{ inputs.version }}
      dry_run: ${{ !inputs.publish }}
      require-signed-tag: true
      require-current-signer: true
      strict-checks: true
      ci-check-events: '["push"]'
      test-runs-on: ubuntu-latest
      test-command: node scripts/release-local-package-envelope.mjs ${{ needs.qualification.outputs.artifact-id }}
      generated-input-artifact-id: ${{ needs.qualification.outputs.artifact-id }}
      generated-asset: clawsweeper-local-envelope.tar.gz
      source-archives: false
      homebrew-formula: ""
