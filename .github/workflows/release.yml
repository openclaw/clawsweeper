name: Local package release rehearsal

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already recorded in dated release notes and package metadata
        required: true
        type: string

permissions: {}

jobs:
  qualification:
    uses: ./.github/workflows/local-package-qualification.yml
    permissions:
      contents: read

  release:
    needs: qualification
    # The pinned callee declares write access for its tag/publish jobs, even
    # though this caller always rehearses and those paths perform no writes.
    permissions:
      actions: read
      checks: read
      contents: write
      statuses: read
    uses: openclaw/release-workflows/.github/workflows/release-source.yml@9d81ab3d2877f9900ef787e6dbcf4d9af96eb013
    with:
      version: ${{ inputs.version }}
      dry_run: true
      require-signed-tag: true
      strict-checks: true
      ci-check-events: '["push"]'
      test-runs-on: ubuntu-latest
      test-command: node scripts/release-local-package-envelope.mjs ${{ needs.qualification.outputs.artifact-id }}
      generated-input-artifact-id: ${{ needs.qualification.outputs.artifact-id }}
      generated-asset: clawsweeper-local-envelope.tar.gz
      source-archives: false
      homebrew-formula: ""
