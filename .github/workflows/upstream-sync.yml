name: Upstream Sync

# Daily check for new commits on the upstream fork. Opens a PR with the merge
# (never force-pushes to main). On conflict: log paths and exit 0 — no PR,
# no email churn. Resolve manually; the next daily run will pick up again.
#
# Source-of-truth registry: ~/Projects/personal/agent-system/FORKS.md
# Owner routine: CTO agent on Multica (home workspace).

on:
  schedule:
    # 06:00 SAST = 04:00 UTC. Daily.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  UPSTREAM_REPO: openclaw/clawsweeper
  UPSTREAM_BRANCH: main
  FORK_BRANCH: main
  CLAWSWEEPER_APP_CLIENT_ID: Iv23lirdjmVqYd1gwY26

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ env.CLAWSWEEPER_APP_CLIENT_ID }}
          private-key: ${{ secrets.CLAWSWEEPER_APP_PRIVATE_KEY }}
          owner: valkyriweb
          repositories: clawsweeper

      - name: Checkout fork
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream "${UPSTREAM_BRANCH}" --quiet

      - name: Check for upstream changes
        id: check
        run: |
          BEHIND=$(git rev-list --count "origin/${FORK_BRANCH}..upstream/${UPSTREAM_BRANCH}")
          echo "behind=${BEHIND}" >> "$GITHUB_OUTPUT"
          echo "Behind upstream by ${BEHIND} commits."
          if [ "${BEHIND}" = "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if up-to-date
        if: steps.check.outputs.skip == 'true'
        run: echo "::notice::Fork is up to date with ${UPSTREAM_REPO}@${UPSTREAM_BRANCH}. Nothing to do."

      - name: Configure git author
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create sync branch and attempt merge
        if: steps.check.outputs.skip != 'true'
        id: merge
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="sync/upstream-${DATE}"
          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

          # Reuse same-day branch if it already exists (idempotent re-runs).
          if git ls-remote --exit-code origin "refs/heads/${BRANCH}" >/dev/null 2>&1; then
            echo "::notice::Sync branch ${BRANCH} already exists — refreshing."
            git fetch origin "${BRANCH}"
            git checkout -B "${BRANCH}" "origin/${BRANCH}"
          else
            git checkout -B "${BRANCH}" "origin/${FORK_BRANCH}"
          fi

          if git merge --no-ff --no-edit "upstream/${UPSTREAM_BRANCH}"; then
            echo "draft=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Clean merge."
          else
            # Conflicts: log paths, abort, exit cleanly. No PR, no email churn.
            # Subsequent daily runs will keep trying; resolve manually when ready.
            CONFLICTS=$(git diff --name-only --diff-filter=U | head -30)
            COUNT=$(echo "${CONFLICTS}" | grep -c . || true)
            echo "::notice::Conflicts in ${COUNT} file(s); skipping PR. Resolve manually:"
            echo "${CONFLICTS}"
            git merge --abort
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git push "https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/valkyriweb/clawsweeper.git" "${BRANCH}" --force-with-lease

      - name: Open or update PR
        if: steps.check.outputs.skip != 'true' && steps.merge.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.merge.outputs.branch }}
          DRAFT: ${{ steps.merge.outputs.draft }}
          BEHIND: ${{ steps.check.outputs.behind }}
        run: |
          set -e

          TITLE="sync: ${UPSTREAM_REPO}@${UPSTREAM_BRANCH} → ${FORK_BRANCH}"

          BODY=$(cat <<EOF
          Automated daily sync from \`${UPSTREAM_REPO}@${UPSTREAM_BRANCH}\`.

          - Commits pulled: ${BEHIND}
          - Strategy: \`git merge --no-ff\` (preserves fork lineage)

          Awaiting:
          - [ ] Warden review (when runner is online)
          - [ ] CTO agent triage
          - [ ] Merge

          Registry: \`agent-system/FORKS.md\`.
          EOF
          )

          # Find existing open PR for this branch, or create one.
          EXISTING=$(gh pr list --repo valkyriweb/clawsweeper --head "${BRANCH}" --state open --json number -q '.[0].number')
          if [ -n "${EXISTING}" ]; then
            gh pr edit "${EXISTING}" --repo valkyriweb/clawsweeper --title "${TITLE}" --body "${BODY}"
            echo "::notice::Updated existing PR #${EXISTING}."
          else
            PR_URL=$(gh pr create \
              --repo valkyriweb/clawsweeper \
              --base "${FORK_BRANCH}" \
              --head "${BRANCH}" \
              --title "${TITLE}" \
              --body "${BODY}")
            echo "::notice::Opened ${PR_URL}"
            PR_NUM=$(echo "${PR_URL}" | grep -oE '[0-9]+$')
            # Best-effort label add (skip silently if label doesn't exist yet)
            gh pr edit "${PR_NUM}" --add-label "upstream-sync" 2>/dev/null || \
              echo "::warning::Could not add label upstream-sync (may not exist). Run: gh label create upstream-sync"
          fi
